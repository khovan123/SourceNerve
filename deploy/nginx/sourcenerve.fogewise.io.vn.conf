# SourceNerve public MCP reverse proxy.
#
# Install this file at:
#   /etc/nginx/sites-available/sourcenerve.fogewise.io.vn
# then symlink it into sites-enabled and run Certbot as documented in
# docs/oauth-mcp-auth.md.
#
# Keep SourceNerve itself bound to 127.0.0.1:7331. TLS terminates here.

server {
    listen 80;
    listen [::]:80;
    server_name sourcenerve.fogewise.io.vn;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:7331;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # OAuth access tokens must reach SourceNerve unchanged.
        proxy_set_header Authorization $http_authorization;

        # Streamable HTTP MCP may keep requests/responses open. Do not buffer
        # or cache the transport at the reverse proxy.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
