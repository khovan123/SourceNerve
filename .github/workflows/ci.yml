name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: sourcenerve-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Wire distributed leases into remaining mutation paths
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def add_import(path):
              text = read(path)
              if re.search(r'use crate::\{\s*coordination[,\s]', text):
                  return text
              marker = 'use crate::{\n'
              if marker not in text:
                  raise SystemExit(f'missing crate import marker: {path}')
              text = text.replace(marker, marker + '    coordination,\n', 1)
              write(path, text)
              return text

          # Helper resolves task -> workspace before a task-scoped mutation.
          path = 'src/coordination.rs'
          text = read(path)
          if 'pub async fn acquire_for_task' not in text:
              marker = 'pub async fn acquire(state: &AppState, resource_key: &str) -> AppResult<MutationLease> {'
              helper = '''pub async fn acquire_for_task(state: &AppState, task_id: &str) -> AppResult<MutationLease> {
    let workspace: Option<String> = sqlx::query_scalar("SELECT workspace_id FROM tasks WHERE id=?1")
        .bind(task_id)
        .fetch_optional(&state.db)
        .await?;
    let workspace = workspace.ok_or_else(|| {
        AppError::InvalidRequest(format!("task not found for mutation coordination: {task_id}"))
    })?;
    acquire(state, &workspace).await
}

'''
              if marker not in text: raise SystemExit('missing coordination acquire marker')
              text = text.replace(marker, helper + marker, 1)
              write(path, text)

          # Direct Git/GitHub lifecycle. All public mutation requests are workspace-scoped.
          path = 'src/workflow.rs'
          text = add_import(path)
          needle = '        let _guard = self.mutation_lock.lock().await;'
          if needle in text:
              text = text.replace(needle,
                  '        let lease = coordination::acquire(self, &request.workspace).await?;\n'
                  '        let _guard = self.mutation_lock.lock().await;\n'
                  '        lease.assert_current().await?;')
              write(path, text)

          # Task snapshot/status/proposal/apply mutations.
          path = 'src/task_transactions.rs'
          text = add_import(path)
          text = text.replace(
              '    let task_id = task.id.clone();\n    let _guard = state.mutation_lock.lock().await;',
              '    let task_id = task.id.clone();\n    let lease = coordination::acquire_for_task(state, &task_id).await?;\n    let _guard = state.mutation_lock.lock().await;\n    lease.assert_current().await?;', 1)
          text = text.replace(
              '    let _guard = state.mutation_lock.lock().await;\n    let head_after = git::head(&workspace.root).await?;',
              '    let lease = coordination::acquire(state, &req.workspace).await?;\n    let _guard = state.mutation_lock.lock().await;\n    lease.assert_current().await?;\n    let head_after = git::head(&workspace.root).await?;', 1)
          for fn_name in ('cancel', 'propose_patch', 'apply_patch'):
              pattern = re.compile(rf'(pub async fn {fn_name}\b.*?\{{.*?)(    let _guard = state\.mutation_lock\.lock\(\)\.await;)', re.S)
              m = pattern.search(text)
              if m and 'coordination::acquire_for_task' not in m.group(1)[-400:]:
                  insertion = '    let lease = coordination::acquire_for_task(state, &req.task_id).await?;\n    let _guard = state.mutation_lock.lock().await;\n    lease.assert_current().await?;'
                  text = text[:m.start(2)] + insertion + text[m.end(2):]
          write(path, text)

          # Semantic run activation.
          path = 'src/semantic.rs'
          text = add_import(path)
          needle = '    let _guard = state.mutation_lock.lock().await;\n    let workspace = state.workspaces.get(&req.workspace)?;'
          if needle in text:
              text = text.replace(needle,
                  '    let lease = coordination::acquire(state, &req.workspace).await?;\n'
                  '    let _guard = state.mutation_lock.lock().await;\n'
                  '    lease.assert_current().await?;\n'
                  '    let workspace = state.workspaces.get(&req.workspace)?;', 1)
              write(path, text)

          # SCIP stale invalidation and import activation.
          path = 'src/scip_enrichment.rs'
          text = add_import(path)
          needle = '    let _guard = state.mutation_lock.lock().await;\n    let workspace = state.workspaces.get(workspace_id)?;'
          if needle in text:
              text = text.replace(needle,
                  '    let lease = coordination::acquire(state, workspace_id).await?;\n'
                  '    let _guard = state.mutation_lock.lock().await;\n'
                  '    lease.assert_current().await?;\n'
                  '    let workspace = state.workspaces.get(workspace_id)?;', 1)
          needle = '    let _guard = state.mutation_lock.lock().await;\n    let workspace = state.workspaces.get(&req.workspace)?;'
          if needle in text:
              text = text.replace(needle,
                  '    let lease = coordination::acquire(state, &req.workspace).await?;\n'
                  '    let _guard = state.mutation_lock.lock().await;\n'
                  '    lease.assert_current().await?;\n'
                  '    let workspace = state.workspaces.get(&req.workspace)?;', 1)
          write(path, text)

          # Architecture snapshot activation.
          path = 'src/architecture.rs'
          text = add_import(path)
          needle = '    state.workspaces.get(workspace)?;\n    let _guard = state.mutation_lock.lock().await;'
          if needle in text:
              text = text.replace(needle,
                  '    state.workspaces.get(workspace)?;\n'
                  '    let lease = coordination::acquire(state, workspace).await?;\n'
                  '    let _guard = state.mutation_lock.lock().await;\n'
                  '    lease.assert_current().await?;', 1)
              write(path, text)

          # State backup coordinates on a global state resource.
          path = 'src/state_backup.rs'
          text = add_import(path)
          needle = '        let retain = request.retain.clamp(1, 50);\n        let _guard = self.mutation_lock.lock().await;'
          if needle in text:
              text = text.replace(needle,
                  '        let retain = request.retain.clamp(1, 50);\n'
                  '        let lease = coordination::acquire(self, "state:backup").await?;\n'
                  '        let _guard = self.mutation_lock.lock().await;\n'
                  '        lease.assert_current().await?;', 1)
              write(path, text)

          # Explicit callback retry is a durable mutation; worker claims remain atomic SQLite CAS.
          path = 'src/callback.rs'
          text = add_import(path)
          marker = '    validate_delivery_id(&request.delivery_id)?;\n    let result = sqlx::query('
          if marker in text and 'callback delivery has no workspace' not in text:
              replacement = '''    validate_delivery_id(&request.delivery_id)?;
    let workspace: Option<String> = sqlx::query_scalar(
        "SELECT workspace_id FROM callback_outbox WHERE delivery_id=?1",
    )
    .bind(&request.delivery_id)
    .fetch_optional(&state.db)
    .await?;
    let workspace = workspace.ok_or_else(|| {
        AppError::InvalidRequest(format!("callback delivery not found: {}", request.delivery_id))
    })?;
    let lease = coordination::acquire(state, &workspace).await?;
    lease.assert_current().await?;
    let result = sqlx::query('''
              text = text.replace(marker, replacement, 1)
              # Fence once more before exposing the updated durable state.
              text = text.replace(
                  '    get(state, request).await\n}\n\nasync fn claim_due',
                  '    lease.assert_current().await?;\n    get(state, request).await\n}\n\nasync fn claim_due', 1)
              write(path, text)

          # Fail the one-shot if a known production mutex mutation remains without a nearby lease.
          protected = ['src/workflow.rs','src/task_transactions.rs','src/semantic.rs','src/scip_enrichment.rs','src/architecture.rs','src/state_backup.rs']
          for file in protected:
              data = read(file)
              for match in re.finditer(r'(?:self|state)\.mutation_lock\.lock\(\)\.await', data):
                  before = data[max(0, match.start()-420):match.start()]
                  if 'coordination::acquire' not in before and 'coordination::acquire_for_task' not in before:
                      raise SystemExit(f'uncoordinated mutation lock remains in {file}')
          PY

          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          cargo +1.88.0 fmt --all
          git config user.name "SourceNerve Roadmap Bot"
          git config user.email "sourcenerve-roadmap@users.noreply.github.com"
          git add src
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat: fence remaining mutation paths"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.88.0

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
