name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sourcenerve-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    concurrency:
      group: sourcenerve-heavy
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - linux
      - x64
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim stale SourceNerve build artifacts
        run: |
          set -euo pipefail
          find "$HOME" -type d -path '*/_work/SourceNerve/SourceNerve/target' -prune \
            -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Ensure pinned Rust toolchain
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export PATH="$CARGO_HOME/bin:$PATH"

          exec 9>/tmp/sourcenerve-rustup.lock
          flock 9

          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$CARGO_HOME/bin:$PATH"
          fi

          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy

          flock -u 9
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Reclaim clippy artifacts before tests
        run: cargo clean

      - run: cargo test --all-features

      - name: Cleanup Rust build artifacts
        if: always()
        run: cargo clean || true
