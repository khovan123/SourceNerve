name: CI
on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sourcenerve-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0

      - name: Wire registry MCP and capability from current head
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/mcp.rs')
          s = p.read_text()
          s = s.replace('embedding_provider::{self, SemanticProviderIndexRequest, SemanticSearchTextRequest},', 'embedding_registry::{self, SemanticProviderIndexRequest, SemanticSearchTextRequest},')
          s = s.replace('Generate and activate a bounded deterministic OpenAI embedding run for the exact clean indexed workspace. Source leaves SourceNerve only when this tool is explicitly called.', 'Generate and activate a bounded deterministic embedding run through one configured managed provider for the exact clean indexed workspace. Clients may select only configured provider IDs; source leaves SourceNerve only when this tool is explicitly called.')
          s = s.replace('match embedding_provider::index(&self.state, args).await {', 'match embedding_registry::index(&self.state, args).await {')
          s = s.replace('Embed one bounded text query through the configured OpenAI embedding provider and run exact cosine search against the current managed semantic run. Query text is not persisted.', 'Embed one bounded text query through one configured managed embedding provider and run semantic search against the matching current managed semantic run. Query text is not persisted.')
          s = s.replace('match embedding_provider::search_text(&self.state, args).await {', 'match embedding_registry::search_text(&self.state, args).await {')
          p.write_text(s)

          p = Path('src/runtime.rs')
          s = p.read_text()
          if '"embedding-provider-registry"' not in s:
              s = s.replace('            "managed-embeddings",\n', '            "managed-embeddings",\n            "embedding-provider-registry",\n')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mcp.rs src/runtime.rs
          git commit -m "feat: expose embedding provider registry through MCP" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
