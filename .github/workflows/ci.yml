name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sourcenerve-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.88.0

      - name: Check deployment shell syntax
        run: bash -n scripts/provision-auth0-mcp.sh scripts/verify-oauth-deployment.sh scripts/verify-plugin-submission.sh scripts/verify-desktop-bootstrap.sh

      - name: Verify Desktop bootstrap profile
        run: bash scripts/verify-desktop-bootstrap.sh

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  desktop:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain for bundled daemon
        working-directory: .
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install Desktop dependencies
        # npm 10.9.2/Arborist currently crashes while loading some modern peer
        # sets with `Cannot read properties of null (reading 'edgesOut')`.
        # Disable peer auto-placement here, then independently validate the
        # resolved tree and security audit below instead of accepting it blindly.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate Desktop dependency tree
        run: npm ls --all

      - name: Verify Desktop security baseline
        run: npm run security:check

      - name: Audit Desktop dependencies
        run: npm audit --audit-level=high

      - name: Typecheck Desktop
        run: npm run typecheck

      - name: Test Desktop
        run: npm test

      - name: Package Desktop with bundled daemon
        run: npm run package
