name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: sourcenerve-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.88.0

      - name: Wire managed SCIP MCP tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/mcp.rs')
          text = path.read_text()
          old_import = '    scip_enrichment::{self, ScipImportRequest},\n'
          new_import = '    scip_analyzer::{self, ScipAnalyzeRequest},\n    scip_enrichment::{self, ScipImportRequest},\n'
          if 'scip_analyzer::{self, ScipAnalyzeRequest}' not in text:
              if old_import not in text:
                  raise SystemExit('SCIP import anchor missing')
              text = text.replace(old_import, new_import, 1)

          anchor = '''    #[tool(\n        description = "Import a bounded base64 official SCIP protobuf index for the exact clean Git HEAD and deterministic graph version. Ambiguous symbols remain unresolved and deterministic graph facts are never overwritten."\n    )]\n    async fn scip_import(\n'''
          tools = '''    #[tool(\n        description = "Return the operator-configured managed SCIP analyzers and bounded eligible project roots for one workspace. Executable paths and command arguments are never exposed."\n    )]\n    async fn scip_analyzer_status(\n        &self,\n        Parameters(args): Parameters<WorkspaceArg>,\n    ) -> Result<CallToolResult, McpError> {\n        match scip_analyzer::status(&self.state, &args.workspace).await {\n            Ok(v) => Self::ok(&v),\n            Err(e) => Self::err(e),\n        }\n    }\n\n    #[tool(\n        description = "Run one server-owned managed SCIP analyzer for a detected project root. Clients cannot supply executables or command arguments; successful output activates only through the existing exact HEAD/graph SCIP importer."\n    )]\n    async fn scip_analyze(\n        &self,\n        Parameters(args): Parameters<ScipAnalyzeRequest>,\n    ) -> Result<CallToolResult, McpError> {\n        match scip_analyzer::analyze(&self.state, args).await {\n            Ok(v) => Self::ok(&v),\n            Err(e) => Self::err(e),\n        }\n    }\n\n'''
          if 'async fn scip_analyze(' not in text:
              if anchor not in text:
                  raise SystemExit('SCIP tool anchor missing')
              text = text.replace(anchor, tools + anchor, 1)
          path.write_text(text)
          PY

      - run: cargo fmt --all
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

      - name: Commit formatter and MCP wiring
        run: |
          git config user.name "SourceNerve CI"
          git config user.email "ci@example.invalid"
          git add src/scip_analyzer.rs src/mcp.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: expose managed SCIP analyzer MCP tools"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
