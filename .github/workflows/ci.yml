name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: sourcenerve-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.88.0

      - name: Normalize Rust source and dependency lock
        run: |
          cargo fmt --all
          cargo generate-lockfile

      - name: Persist normalization on same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: normalize SCIP source and dependency lock"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
