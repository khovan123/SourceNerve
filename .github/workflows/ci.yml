name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Normalize Rust source and lock dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Persist normalized source on same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src build.rs Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: normalize Rust source and lock dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
