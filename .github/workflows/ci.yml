name: CI
on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sourcenerve-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt
          rustup default 1.88.0

      - name: Format managed embedding provider registry
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/embedding_registry.rs src/main.rs src/semantic_context.rs src/semantic_http.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format embedding provider registry"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
