name: CI
on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sourcenerve-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.88.0

      - name: Patch and validate embedding registry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/embedding_registry.rs')
          s = p.read_text()
          s = s.replace('path::{Path, PathBuf},', 'path::PathBuf,')
          s = s.replace('let mut dimension = None;', 'let mut dimension: Option<usize> = None;')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/embedding_registry.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: resolve embedding provider registry compile checkpoint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
