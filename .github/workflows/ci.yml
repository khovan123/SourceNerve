name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Add complete TypeScript tag adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/graph.rs")
          text = path.read_text()
          anchor = "const MAX_TRACE_DEPTH: usize = 4;\n"
          query = r'''const TYPESCRIPT_TAGS_QUERY: &str = r#"
(class_declaration
  name: (_) @name) @definition.class

(class
  name: (_) @name) @definition.class

(method_definition
  name: (property_identifier) @name) @definition.method

(function_declaration
  name: (identifier) @name) @definition.function

(function_signature
  name: (identifier) @name) @definition.function

(method_signature
  name: (property_identifier) @name) @definition.method

(abstract_method_signature
  name: (property_identifier) @name) @definition.method

(abstract_class_declaration
  name: (type_identifier) @name) @definition.class

(interface_declaration
  name: (type_identifier) @name) @definition.interface

(module
  name: (identifier) @name) @definition.module

(lexical_declaration
  (variable_declarator
    name: (identifier) @name
    value: [(arrow_function) (function_expression)]) @definition.function)

(variable_declaration
  (variable_declarator
    name: (identifier) @name
    value: [(arrow_function) (function_expression)]) @definition.function)

(call_expression
  function: (identifier) @name) @reference.call

(call_expression
  function: (member_expression
    property: (property_identifier) @name)) @reference.call

(new_expression
  constructor: (_) @name) @reference.class

(type_annotation
  (type_identifier) @name) @reference.type
"#;
'''
          if "const TYPESCRIPT_TAGS_QUERY" not in text:
              text = text.replace(anchor, anchor + "\n" + query, 1)
          text = text.replace(
              "tags_query: tree_sitter_typescript::TAGS_QUERY,",
              "tags_query: TYPESCRIPT_TAGS_QUERY,",
          )
          path.write_text(text)
          PY
      - name: Normalize Rust source and lock dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Persist normalized source on same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src build.rs Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix: complete TypeScript graph tag extraction"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
