name: SCIP hardening final bootstrap
on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Apply graph provenance and conservative mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          graph = Path('src/graph.rs')
          text = graph.read_text()
          text = once(text,
              '    error::{AppError, AppResult},\n    service::AppState,',
              '    error::{AppError, AppResult},\n    scip_enrichment,\n    service::AppState,',
              'graph import')
          text, count = re.subn(
              r'(pub struct GraphStatus \{.*?    pub unresolved_references: u64,\n)\}',
              r'\1    pub scip: crate::scip_enrichment::ScipStatus,\n}',
              text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'graph status field: expected 1 match, found {count}')
          text = once(text,
              '    pub confidence: f64,\n    pub symbol: SymbolView,',
              '    pub confidence: f64,\n    pub source: String,\n    pub symbol: SymbolView,',
              'neighbor provenance')
          text = once(text,
              '    pub distance: usize,\n    pub via: String,\n    pub symbol: SymbolView,',
              '    pub distance: usize,\n    pub via: String,\n    pub source: String,\n    pub symbol: SymbolView,',
              'trace provenance')
          text = once(text,
              'pub async fn status(state: &AppState, workspace_id: &str) -> AppResult<GraphStatus> {\n    state.workspaces.get(workspace_id)?;',
              'pub async fn status(state: &AppState, workspace_id: &str) -> AppResult<GraphStatus> {\n    state.workspaces.get(workspace_id)?;\n    let scip = scip_enrichment::ensure_current(state, workspace_id).await?;',
              'status guard')
          text = once(text,
              '        unresolved_references: unresolved_references.max(0) as u64,\n    })',
              '        unresolved_references: unresolved_references.max(0) as u64,\n        scip,\n    })',
              'status output')
          text = once(text,
              'let rows: Vec<(String, f64, String)> = match (outgoing, edge_filter) {',
              'let rows: Vec<(String, f64, String, String)> = match (outgoing, edge_filter) {',
              'neighbor tuple')
          for old, new, expected, label in [
              ('SELECT e.edge_type, e.confidence, target.symbol_key', 'SELECT e.edge_type, e.confidence, e.source, target.symbol_key', 2, 'outgoing SQL'),
              ('SELECT e.edge_type, e.confidence, source.symbol_key', 'SELECT e.edge_type, e.confidence, e.source, source.symbol_key', 2, 'incoming SQL'),
          ]:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              text = text.replace(old, new)
          text = once(text,
              '    for (edge_type, confidence, key) in rows {\n        result.push(NeighborView {\n            edge_type,\n            confidence,',
              '    for (edge_type, confidence, source, key) in rows {\n        result.push(NeighborView {\n            edge_type,\n            confidence,\n            source,',
              'neighbor row')
          text = once(text,
              'pub async fn symbol_context(state: &AppState, req: SymbolKeyRequest) -> AppResult<SymbolContext> {\n    state.workspaces.get(&req.workspace)?;',
              'pub async fn symbol_context(state: &AppState, req: SymbolKeyRequest) -> AppResult<SymbolContext> {\n    state.workspaces.get(&req.workspace)?;\n    scip_enrichment::ensure_current(state, &req.workspace).await?;',
              'context guard')
          text = once(text,
              '    state.workspaces.get(&req.workspace)?;\n    let depth = req.depth.clamp(1, MAX_TRACE_DEPTH);',
              '    state.workspaces.get(&req.workspace)?;\n    scip_enrichment::ensure_current(state, &req.workspace).await?;\n    let depth = req.depth.clamp(1, MAX_TRACE_DEPTH);',
              'trace guard')
          text = once(text,
              '                via: neighbor.edge_type,\n                symbol: neighbor.symbol,',
              '                via: neighbor.edge_type,\n                source: neighbor.source,\n                symbol: neighbor.symbol,',
              'trace source')
          graph.write_text(text)

          scip = Path('src/scip_enrichment.rs')
          text = scip.read_text()
          text = once(text,
              '    let mut symbol_map = HashMap::new();\n    let mut unresolved = Vec::new();',
              '    let mut symbol_map = HashMap::new();\n    let mut ambiguous_scip_symbols = HashSet::new();\n    let mut unresolved = Vec::new();',
              'ambiguous set')
          text = once(text,
              '            match symbol_map.get(&occurrence.symbol) {',
              '            if ambiguous_scip_symbols.contains(&occurrence.symbol) {\n                continue;\n            }\n            match symbol_map.get(&occurrence.symbol) {',
              'ambiguous guard')
          text = once(text,
              '                    symbol_map.remove(&occurrence.symbol);',
              '                    symbol_map.remove(&occurrence.symbol);\n                    ambiguous_scip_symbols.insert(occurrence.symbol.clone());',
              'ambiguous mark')
          scip.write_text(text)
          PY

          cargo fmt --all

      - name: Persist hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/graph.rs src/scip_enrichment.rs
          git commit -m "feat: harden SCIP provenance and stale graph queries"
          git push origin HEAD:${{ github.head_ref }}
