name: Task Lifecycle Smoke
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sourcenerve-task-lifecycle-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  task-lifecycle-smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_CONTAINER: sourcenerve-task-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: sourcenerve:task-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: |
          docker build \
            --build-arg SOURCENERVE_BUILD_COMMIT="${GITHUB_SHA}" \
            -t "$SMOKE_IMAGE" .

      - name: Prepare writable Git fixture
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-task-smoke"
          mkdir -p "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/state" "$SMOKE/config"
          git -C "$SMOKE/remote.git" init --bare
          git -C "$SMOKE/repo" init -b main
          git -C "$SMOKE/repo" config user.name "SourceNerve CI"
          git -C "$SMOKE/repo" config user.email "ci@example.invalid"
          printf 'pub fn smoke() -> bool { true }\n' > "$SMOKE/repo/lib.rs"
          git -C "$SMOKE/repo" add lib.rs
          git -C "$SMOKE/repo" commit -m "task smoke fixture"
          git -C "$SMOKE/repo" remote add origin "$SMOKE/remote.git"
          git -C "$SMOKE/repo" push -u origin main
          git -C "$SMOKE/repo" remote set-url origin /smoke/remote.git

          cat > "$SMOKE/config/sourcenerve.toml" <<'EOF'
          [server]
          bind = "0.0.0.0:7331"

          [storage]
          state_dir = "/state"

          [auth]
          bearer_token = "ci-placeholder-token-overridden-by-env"

          [[workspace]]
          id = "smoke"
          name = "Smoke Repository"
          root = "/smoke/repo"
          access = "read-write"
          remote = "origin"
          default_branch = "main"
          EOF

          chmod -R a+rwX "$SMOKE/repo" "$SMOKE/remote.git"
          chmod -R a+rX "$SMOKE/config"
          chmod 0777 "$SMOKE/state"

      - name: Start production container
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-task-smoke"
          docker run -d --name "$SMOKE_CONTAINER" \
            -p 127.0.0.1::7331 \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN=ci-task-bearer-token-0123456789abcdef \
            -e GIT_CONFIG_COUNT=2 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -e GIT_CONFIG_KEY_1=safe.directory \
            -e GIT_CONFIG_VALUE_1=/smoke/remote.git \
            -v "$SMOKE/config:/config:ro" \
            -v "$SMOKE/repo:/smoke/repo" \
            -v "$SMOKE/remote.git:/smoke/remote.git" \
            -v "$SMOKE/state:/state" \
            "$SMOKE_IMAGE"
          HOST_ENDPOINT="$(docker port "$SMOKE_CONTAINER" 7331/tcp | head -n 1)"
          HOST_PORT="${HOST_ENDPOINT##*:}"
          case "$HOST_PORT" in ''|*[!0-9]*) exit 1;; esac
          printf '%s\n' "$HOST_PORT" > "$RUNNER_TEMP/sourcenerve-task-smoke-port"

      - name: Run durable task through push
        env:
          SOURCENERVE_SMOKE_TOKEN: ci-task-bearer-token-0123456789abcdef
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-task-smoke-port")"
          export SOURCENERVE_SMOKE_BASE="http://127.0.0.1:${PORT}"
          export SOURCENERVE_SMOKE_OUT="$RUNNER_TEMP/task-smoke"
          bash scripts/task-lifecycle-smoke.sh

          SMOKE="$RUNNER_TEMP/sourcenerve-task-smoke"
          REMOTE_HEAD=$(git --git-dir "$SMOKE/remote.git" rev-parse refs/heads/feat/smoke-lifecycle)
          PUSH_HEAD=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["push"]["head"])' "$SOURCENERVE_SMOKE_OUT/push.json")
          test "$REMOTE_HEAD" = "$PUSH_HEAD"

      - name: Smoke MCP lifecycle tools
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-task-smoke-port")"
          BASE="http://127.0.0.1:${PORT}"
          AUTH='Authorization: Bearer ci-task-bearer-token-0123456789abcdef'
          ACCEPT='Accept: application/json, text/event-stream'
          PROTOCOL='2025-06-18'
          INIT="$RUNNER_TEMP/task-mcp-init.json"
          HEADERS="$RUNNER_TEMP/task-mcp.headers"
          TOOLS="$RUNNER_TEMP/task-mcp-tools.json"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"task-ci","version":"1.0"}}}' > "$INIT"
          curl -fsS -D "$HEADERS" -o /dev/null -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' --data-binary @"$INIT"
          SESSION=$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/ {gsub("\r", "", $2); print $2}' "$HEADERS" | tail -1)
          SESSION_HEADERS=()
          if [ -n "$SESSION" ]; then SESSION_HEADERS=(-H "Mcp-Session-Id: $SESSION"); fi
          curl -fsS -o /dev/null -X POST "$BASE/mcp" -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
          curl -fsS -o "$TOOLS" -X POST "$BASE/mcp" -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          python3 - "$TOOLS" <<'PY'
          import json, sys
          names = {tool['name'] for tool in json.load(open(sys.argv[1]))['result']['tools']}
          expected = {
              'task_branch_checkout', 'task_git_review', 'task_git_commit', 'task_git_push',
              'task_github_issue_create', 'task_github_pull_create', 'task_github_pull_get',
              'task_github_pull_merge', 'task_default_sync'
          }
          assert not (expected - names), (expected - names, sorted(names))
          PY

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs "$SMOKE_CONTAINER" || true
          docker rm -f "$SMOKE_CONTAINER" || true
          docker image rm "$SMOKE_IMAGE" >/dev/null 2>&1 || true
