name: Task Lifecycle Smoke
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sourcenerve-task-lifecycle-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  task-lifecycle-smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_CONTAINER: sourcenerve-task-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: sourcenerve:task-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: |
          docker build \
            --build-arg SOURCENERVE_BUILD_COMMIT="${GITHUB_SHA}" \
            -t "$SMOKE_IMAGE" .

      - name: Prepare writable Git fixture
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-task-smoke"
          mkdir -p "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/state" "$SMOKE/config"
          git -C "$SMOKE/remote.git" init --bare
          git -C "$SMOKE/repo" init -b main
          git -C "$SMOKE/repo" config user.name "SourceNerve CI"
          git -C "$SMOKE/repo" config user.email "ci@example.invalid"
          printf 'pub fn smoke() -> bool { true }\n' > "$SMOKE/repo/lib.rs"
          git -C "$SMOKE/repo" add lib.rs
          git -C "$SMOKE/repo" commit -m "task smoke fixture"
          git -C "$SMOKE/repo" remote add origin ../remote.git
          git -C "$SMOKE/repo" push -u origin main

          cat > "$SMOKE/config/sourcenerve.toml" <<'EOF'
          [server]
          bind = "0.0.0.0:7331"

          [storage]
          state_dir = "/state"

          [auth]
          bearer_token = "ci-placeholder-token-overridden-by-env"

          [[workspace]]
          id = "smoke"
          name = "Smoke Repository"
          root = "/smoke/repo"
          access = "read-write"
          remote = "origin"
          default_branch = "main"
          EOF

          chmod -R a+rwX "$SMOKE/repo" "$SMOKE/remote.git"
          chmod -R a+rX "$SMOKE/config"
          chmod 0777 "$SMOKE/state"

      - name: Start production container
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-task-smoke"
          docker run -d --name "$SMOKE_CONTAINER" \
            -p 127.0.0.1::7331 \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN=ci-task-bearer-token-0123456789abcdef \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" \
            -v "$SMOKE/repo:/smoke/repo" \
            -v "$SMOKE/remote.git:/smoke/remote.git" \
            -v "$SMOKE/state:/state" \
            "$SMOKE_IMAGE"
          HOST_ENDPOINT="$(docker port "$SMOKE_CONTAINER" 7331/tcp | head -n 1)"
          HOST_PORT="${HOST_ENDPOINT##*:}"
          case "$HOST_PORT" in ''|*[!0-9]*) exit 1;; esac
          printf '%s\n' "$HOST_PORT" > "$RUNNER_TEMP/sourcenerve-task-smoke-port"

      - name: Run durable task through push
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-task-smoke-port")"
          BASE="http://127.0.0.1:${PORT}"
          AUTH='Authorization: Bearer ci-task-bearer-token-0123456789abcdef'
          OUT="$RUNNER_TEMP/task-smoke"
          mkdir -p "$OUT"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "$BASE/healthz" > "$OUT/health.json"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs "$SMOKE_CONTAINER"; exit 1; fi

          curl -fsS -H "$AUTH" "$BASE/api/v1/status" > "$OUT/status.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke"}' "$BASE/api/v1/index" > "$OUT/index.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke","query":"smoke","seed_symbol_keys":[],"max_bytes":4096,"max_items":5,"require_clean":true}' \
            "$BASE/api/v1/context/pack" > "$OUT/context.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke","client_request_id":"smoke:lifecycle","context_query":"smoke","context_max_bytes":4096,"context_max_items":5}' \
            "$BASE/api/v1/tasks/begin" > "$OUT/begin.json"

          TASK_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["task"]["id"])' "$OUT/begin.json")
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"task_id\":\"$TASK_ID\",\"branch\":\"feat/smoke-lifecycle\"}" \
            "$BASE/api/v1/tasks/lifecycle/branch" > "$OUT/branch.json"

          python3 - "$TASK_ID" "$OUT/context.json" > "$OUT/proposal-request.json" <<'PY'
          import json, sys
          task_id = sys.argv[1]
          context = json.load(open(sys.argv[2]))
          sha = context['items'][0]['sha256']
          patch = "diff --git a/lib.rs b/lib.rs\n--- a/lib.rs\n+++ b/lib.rs\n@@ -1 +1 @@\n-pub fn smoke() -> bool { true }\n+pub fn smoke() -> bool { false }\n"
          print(json.dumps({
              'task_id': task_id,
              'idempotency_key': 'smoke:lifecycle:proposal',
              'expected_files': [{'path': 'lib.rs', 'sha256': sha}],
              'patch': patch,
          }))
          PY
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            --data-binary @"$OUT/proposal-request.json" \
            "$BASE/api/v1/tasks/proposals/create" > "$OUT/proposal.json"
          PROPOSAL_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["proposal"]["id"])' "$OUT/proposal.json")
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"task_id\":\"$TASK_ID\",\"proposal_id\":\"$PROPOSAL_ID\"}" \
            "$BASE/api/v1/tasks/proposals/apply" > "$OUT/apply.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"task_id\":\"$TASK_ID\"}" \
            "$BASE/api/v1/tasks/lifecycle/review" > "$OUT/review.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"task_id\":\"$TASK_ID\",\"message\":\"task lifecycle smoke\"}" \
            "$BASE/api/v1/tasks/lifecycle/commit" > "$OUT/commit.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"task_id\":\"$TASK_ID\"}" \
            "$BASE/api/v1/tasks/lifecycle/push" > "$OUT/push.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"task_id\":\"$TASK_ID\"}" \
            "$BASE/api/v1/tasks/get" > "$OUT/get.json"

          python3 - "$OUT/status.json" "$OUT/begin.json" "$OUT/branch.json" "$OUT/review.json" "$OUT/commit.json" "$OUT/push.json" "$OUT/get.json" <<'PY'
          import json, sys
          status, begin, branch, review, commit, push, current = [json.load(open(p)) for p in sys.argv[1:]]
          assert status['identity']['state_schema_version'] == 7, status
          assert 'task-git-pr-lifecycle' in status['identity']['capabilities'], status
          assert begin['task']['status'] == 'active', begin
          assert branch['lifecycle']['phase'] == 'branched', branch
          assert review['lifecycle']['phase'] == 'reviewed', review
          assert review['lifecycle']['reviewed_diff_sha256'] == review['review']['diff_sha256'], review
          assert commit['lifecycle']['phase'] == 'committed', commit
          assert commit['lifecycle']['commit_sha'] == commit['commit']['commit'], commit
          assert push['lifecycle']['phase'] == 'pushed', push
          assert push['lifecycle']['push_sha'] == push['push']['head'], push
          assert current['task']['status'] == 'applied', current
          assert current['lifecycle']['phase'] == 'pushed', current
          assert current['lifecycle']['push_sha'] == push['push']['head'], (current, push)
          assert all('patch' not in event['metadata'] for event in current['events']), current
          PY

          SMOKE="$RUNNER_TEMP/sourcenerve-task-smoke"
          REMOTE_HEAD=$(git --git-dir "$SMOKE/remote.git" rev-parse refs/heads/feat/smoke-lifecycle)
          PUSH_HEAD=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["push"]["head"])' "$OUT/push.json")
          test "$REMOTE_HEAD" = "$PUSH_HEAD"

      - name: Smoke MCP lifecycle tools
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-task-smoke-port")"
          BASE="http://127.0.0.1:${PORT}"
          AUTH='Authorization: Bearer ci-task-bearer-token-0123456789abcdef'
          ACCEPT='Accept: application/json, text/event-stream'
          PROTOCOL='2025-06-18'
          INIT="$RUNNER_TEMP/task-mcp-init.json"
          HEADERS="$RUNNER_TEMP/task-mcp.headers"
          TOOLS="$RUNNER_TEMP/task-mcp-tools.json"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"task-ci","version":"1.0"}}}' > "$INIT"
          curl -fsS -D "$HEADERS" -o /dev/null -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' --data-binary @"$INIT"
          SESSION=$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/ {gsub("\r", "", $2); print $2}' "$HEADERS" | tail -1)
          SESSION_HEADERS=()
          if [ -n "$SESSION" ]; then SESSION_HEADERS=(-H "Mcp-Session-Id: $SESSION"); fi
          curl -fsS -o /dev/null -X POST "$BASE/mcp" -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
          curl -fsS -o "$TOOLS" -X POST "$BASE/mcp" -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          python3 - "$TOOLS" <<'PY'
          import json, sys
          names = {tool['name'] for tool in json.load(open(sys.argv[1]))['result']['tools']}
          expected = {
              'task_branch_checkout', 'task_git_review', 'task_git_commit', 'task_git_push',
              'task_github_issue_create', 'task_github_pull_create', 'task_github_pull_get',
              'task_github_pull_merge', 'task_default_sync'
          }
          assert not (expected - names), (expected - names, sorted(names))
          PY

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs "$SMOKE_CONTAINER" || true
          docker rm -f "$SMOKE_CONTAINER" || true
          docker image rm "$SMOKE_IMAGE" >/dev/null 2>&1 || true
