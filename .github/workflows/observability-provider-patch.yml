name: Observability Provider Patch

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: observability-provider-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Instrument embedding provider transports
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/embedding_provider.rs')
          s=p.read_text()
          s=s.replace(
              '    sync::OnceLock,\n};',
              '    sync::OnceLock,\n    time::Instant,\n};'
          )
          start='''async fn request_embeddings(\n    runtime: &RuntimeConfig,\n    inputs: &[String],\n) -> AppResult<Vec<Vec<f32>>> {\n    if inputs.is_empty()'''
          repl='''async fn request_embeddings(\n    runtime: &RuntimeConfig,\n    inputs: &[String],\n) -> AppResult<Vec<Vec<f32>>> {\n    let started = Instant::now();\n    if inputs.is_empty()'''
          if start not in s:
              raise SystemExit('openai request start marker not found')
          s=s.replace(start,repl,1)
          transport='''    if !output.status.success() {\n        return Err(AppError::Command(\n            "embedding provider transport failed or exceeded configured limits".into(),\n        ));\n    }'''
          transport_repl='''    if !output.status.success() {\n        crate::observability::observe_provider_call(\n            "embedding",\n            "openai",\n            "error",\n            started.elapsed(),\n        );\n        return Err(AppError::Command(\n            "embedding provider transport failed or exceeded configured limits".into(),\n        ));\n    }'''
          if transport not in s:
              raise SystemExit('openai transport marker not found')
          s=s.replace(transport,transport_repl,1)
          status='''    if !(200..300).contains(&status) {\n        return Err(AppError::Command(format!(\n            "embedding provider returned HTTP {status}"\n        )));\n    }'''
          status_repl='''    if !(200..300).contains(&status) {\n        crate::observability::observe_provider_call(\n            "embedding",\n            "openai",\n            "error",\n            started.elapsed(),\n        );\n        return Err(AppError::Command(format!(\n            "embedding provider returned HTTP {status}"\n        )));\n    }\n    crate::observability::observe_provider_call(\n        "embedding",\n        "openai",\n        "success",\n        started.elapsed(),\n    );'''
          if status not in s:
              raise SystemExit('openai status marker not found')
          s=s.replace(status,status_repl,1)
          p.write_text(s)

          p=Path('src/embedding_registry.rs')
          s=p.read_text()
          s=s.replace('    time::Duration,\n};', '    time::{Duration, Instant},\n};')
          old='''impl EmbeddingProvider {\n    fn embed<'a>(&'a self, inputs: &'a [String]) -> EmbedFuture<'a> {\n        Box::pin(async move {\n            match &self.backend {\n                ProviderBackend::OpenAi => Err(AppError::Internal(anyhow::anyhow!(\n                    "OpenAI batch embedding is delegated to the compatibility runtime"\n                ))),\n                ProviderBackend::Executable(executable) => {\n                    request_executable_embeddings(self, executable, inputs).await\n                }\n            }\n        })\n    }\n}'''
          new='''impl EmbeddingProvider {\n    fn embed<'a>(&'a self, inputs: &'a [String]) -> EmbedFuture<'a> {\n        Box::pin(async move {\n            let started = Instant::now();\n            let (kind, result) = match &self.backend {\n                ProviderBackend::OpenAi => (\n                    "openai",\n                    Err(AppError::Internal(anyhow::anyhow!(\n                        "OpenAI batch embedding is delegated to the compatibility runtime"\n                    ))),\n                ),\n                ProviderBackend::Executable(executable) => (\n                    "executable",\n                    request_executable_embeddings(self, executable, inputs).await,\n                ),\n            };\n            crate::observability::observe_provider_call(\n                "embedding",\n                kind,\n                if result.is_ok() { "success" } else { "error" },\n                started.elapsed(),\n            );\n            result\n        })\n    }\n}'''
          if old not in s:
              raise SystemExit('embedding registry provider marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/embedding_provider.rs src/embedding_registry.rs
          git commit -m "feat: instrument embedding provider calls" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
