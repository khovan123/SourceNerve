name: Graph Format Bootstrap
on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'test/close-deterministic-graph-baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
      - name: Format Rust source
        run: cargo fmt --all
      - name: Persist formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "style: format deterministic graph acceptance"
            git push origin HEAD:${{ github.head_ref }}
          fi
