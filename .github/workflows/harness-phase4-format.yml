name: Harness Phase 4 Format

on:
  push:
    branches:
      - feat/162-harness-approval-engine

permissions:
  contents: write

concurrency:
  group: harness-phase4-format
  cancel-in-progress: false

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/162-harness-approval-engine
          fetch-depth: 0
      - name: Install pinned Rustfmt
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No rustfmt changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style(harness): apply rustfmt to approval engine'
          git push origin HEAD:feat/162-harness-approval-engine
