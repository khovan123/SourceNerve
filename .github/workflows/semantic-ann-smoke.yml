name: Semantic ANN Smoke
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sourcenerve-semantic-ann-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semantic-ann-smoke:
    runs-on: ubuntu-24.04
    env:
      SMOKE_CONTAINER: sourcenerve-semantic-ann-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: sourcenerve:semantic-ann-${{ github.run_id }}-${{ github.run_attempt }}
      BEARER_TOKEN: ci-semantic-ann-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: docker build --build-arg SOURCENERVE_BUILD_COMMIT="${GITHUB_SHA}" -t "$SMOKE_IMAGE" .

      - name: Prepare large semantic fixture
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-semantic-ann"
          mkdir -p "$SMOKE/repo/src" "$SMOKE/remote.git" "$SMOKE/state" "$SMOKE/config"
          git -C "$SMOKE/remote.git" init --bare
          git -C "$SMOKE/repo" init -b main
          git -C "$SMOKE/repo" config user.name "SourceNerve CI"
          git -C "$SMOKE/repo" config user.email "ci@example.invalid"
          for i in $(seq -w 0 95); do
            printf 'pub fn item_%s() -> usize { %s }\n' "$i" "$((10#$i))" > "$SMOKE/repo/src/item_${i}.rs"
          done
          git -C "$SMOKE/repo" add .
          git -C "$SMOKE/repo" commit -m "semantic ANN fixture"
          git -C "$SMOKE/repo" remote add origin ../remote.git
          git -C "$SMOKE/repo" push -u origin main
          cat > "$SMOKE/config/sourcenerve.toml" <<'TOML'
          [server]
          bind = "0.0.0.0:7331"
          [storage]
          state_dir = "/state"
          [auth]
          bearer_token = "placeholder-token-overridden"
          [[workspace]]
          id = "ann"
          name = "ANN Fixture"
          root = "/smoke/repo"
          access = "read-only"
          remote = "origin"
          default_branch = "main"
          TOML
          chmod -R a+rX "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/config"
          chmod 0777 "$SMOKE/state"

      - name: Start production container
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-semantic-ann"
          docker run -d --name "$SMOKE_CONTAINER" -p 127.0.0.1::7331 \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN="$BEARER_TOKEN" \
            -e SOURCENERVE_SEMANTIC_ANN_THRESHOLD=32 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" -v "$SMOKE/repo:/smoke/repo:ro" \
            -v "$SMOKE/remote.git:/smoke/remote.git:ro" -v "$SMOKE/state:/state" "$SMOKE_IMAGE"
          ENDPOINT="$(docker port "$SMOKE_CONTAINER" 7331/tcp | head -n1)"; PORT="${ENDPOINT##*:}"
          printf '%s\n' "$PORT" > "$RUNNER_TEMP/semantic-ann-port"
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null && exit 0; sleep 1; done
          docker logs "$SMOKE_CONTAINER"; exit 1

      - name: Import 96 vectors and force HNSW path
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/semantic-ann-port")"; BASE="http://127.0.0.1:${PORT}"
          AUTH="Authorization: Bearer $BEARER_TOKEN"; OUT="$RUNNER_TEMP/semantic-ann-out"; mkdir -p "$OUT"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"workspace":"ann"}' "$BASE/api/v1/index" > "$OUT/index.json"
          python3 - "$BASE" "$BEARER_TOKEN" "$OUT/import.json" <<'PY'
          import json, sys, urllib.request
          base, token, out = sys.argv[1:]
          chunks=[]
          for i in range(96):
              path=f"src/item_{i:02d}.rs"
              req=urllib.request.Request(base+'/api/v1/read', data=json.dumps({'workspace':'ann','path':path,'start_line':None,'end_line':None}).encode(), headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              value=json.load(urllib.request.urlopen(req))
              vector=[1.0,0.0,0.0] if i == 73 else [0.0,1.0,float(i+1)/1000.0]
              chunks.append({'path':path,'start_line':1,'end_line':1,'file_sha256':value['sha256'],'vector':vector})
          body={'workspace':'ann','client_run_id':'ann:96:v1','provider':'ci-fixture','model':'three-dim','dimension':3,'chunks':chunks}
          req=urllib.request.Request(base+'/api/v1/semantic/import', data=json.dumps(body).encode(), headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          result=json.load(urllib.request.urlopen(req)); json.dump(result,open(out,'w'))
          PY
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"workspace":"ann"}' "$BASE/api/v1/semantic/ann/status" > "$OUT/status-before.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"workspace":"ann","query_vector":[1.0,0.0,0.0],"limit":5}' "$BASE/api/v1/semantic/search" > "$OUT/search.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"workspace":"ann"}' "$BASE/api/v1/semantic/ann/status" > "$OUT/status-after.json"
          curl -fsS -H "$AUTH" "$BASE/api/v1/status" > "$OUT/service.json"
          python3 - "$OUT/import.json" "$OUT/status-before.json" "$OUT/search.json" "$OUT/status-after.json" "$OUT/service.json" <<'PY'
          import json,sys
          imp,before,search,after,service=[json.load(open(p)) for p in sys.argv[1:]]
          assert imp['imported_chunks']==96, imp
          assert before['mode']=='hnsw-rebuild-required' and before['eligible_chunks']==96, before
          assert search['hits'][0]['path']=='src/item_73.rs', search
          assert search['hits'][0]['score'] > .9999, search
          assert after['mode']=='hnsw' and after['snapshot_current'] is True, after
          assert after['index_hash'], after
          assert service['identity']['state_schema_version'] >= 14, service
          assert 'semantic-ann-hnsw' in service['identity']['capabilities'], service
          PY

      - name: Restart and rebuild HNSW from authoritative SQLite vectors
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-semantic-ann"; BEFORE="$RUNNER_TEMP/semantic-ann-out/status-after.json"
          HASH="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["index_hash"])' "$BEFORE")"
          docker rm -f "$SMOKE_CONTAINER" >/dev/null
          docker run -d --name "$SMOKE_CONTAINER" -p 127.0.0.1::7331 \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml -e SOURCENERVE_BEARER_TOKEN="$BEARER_TOKEN" \
            -e SOURCENERVE_SEMANTIC_ANN_THRESHOLD=32 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" -v "$SMOKE/repo:/smoke/repo:ro" -v "$SMOKE/remote.git:/smoke/remote.git:ro" -v "$SMOKE/state:/state" "$SMOKE_IMAGE"
          ENDPOINT="$(docker port "$SMOKE_CONTAINER" 7331/tcp | head -n1)"; PORT="${ENDPOINT##*:}"; BASE="http://127.0.0.1:${PORT}"; AUTH="Authorization: Bearer $BEARER_TOKEN"
          for _ in $(seq 1 30); do curl -fsS "$BASE/healthz" >/dev/null && break; sleep 1; done
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"workspace":"ann","query_vector":[1.0,0.0,0.0],"limit":5}' "$BASE/api/v1/semantic/search" > "$RUNNER_TEMP/restart-search.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d '{"workspace":"ann"}' "$BASE/api/v1/semantic/ann/status" > "$RUNNER_TEMP/restart-status.json"
          python3 - "$RUNNER_TEMP/restart-search.json" "$RUNNER_TEMP/restart-status.json" "$HASH" <<'PY'
          import json,sys
          search=json.load(open(sys.argv[1])); status=json.load(open(sys.argv[2])); old=sys.argv[3]
          assert search['hits'][0]['path']=='src/item_73.rs', search
          assert status['mode']=='hnsw' and status['snapshot_current'] is True, status
          assert status['index_hash']==old, (status,old)
          PY

      - name: Logs and cleanup
        if: always()
        run: |
          docker logs "$SMOKE_CONTAINER" || true
          docker rm -f "$SMOKE_CONTAINER" || true
          docker image rm "$SMOKE_IMAGE" >/dev/null 2>&1 || true
