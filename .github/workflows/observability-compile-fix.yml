name: Observability Compile Fix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: observability-compile-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Fix ownership and validate core
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/observability.rs')
          s=p.read_text()
          s=s.replace('.entry((kind.to_string(), provider, result))', '.entry((kind.to_string(), provider.clone(), result.clone()))')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/observability.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: resolve observability ownership checkpoint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
