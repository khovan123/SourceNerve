name: Context wiring bootstrap
on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Wire MCP and normalize context core
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          mcp = Path('src/mcp.rs')
          text = mcp.read_text()
          text = once(
              text,
              'use crate::{\n    graph::{self, SymbolKeyRequest, SymbolSearchRequest, TraceRequest},',
              'use crate::{\n    context::{self, ContextPackRequest},\n    graph::{self, SymbolKeyRequest, SymbolSearchRequest, TraceRequest},',
              'MCP context import',
          )
          marker = '''    #[tool(
        description = "Return the current HEAD-aware SCIP enrichment run for a workspace. Stale enrichment is invalidated before status is returned."
    )]'''
          method = '''    #[tool(
        description = "Build a deterministic bounded repository context pack from FTS, symbols, graph proximity, and edge provenance. Returns relative source ranges with full-file SHA-256 hashes for downstream patch concurrency."
    )]
    async fn context_pack(
        &self,
        Parameters(args): Parameters<ContextPackRequest>,
    ) -> Result<CallToolResult, McpError> {
        match context::pack(&self.state, args).await {
            Ok(v) => Self::ok(&v),
            Err(e) => Self::err(e),
        }
    }

'''
          text = once(text, marker, method + marker, 'MCP context method')
          mcp.write_text(text)

          context = Path('src/context.rs')
          text = context.read_text()
          text = once(
              text,
              '''struct SymbolCandidate {
    key: String,
    path: String,
    start: i64,
    end: i64,
    score: i64,
}''',
              '''struct SymbolCandidate {
    key: String,
    path: String,
    score: i64,
}''',
              'SymbolCandidate fields',
          )
          text = text.replace(
              '''                start: start.unwrap_or(1),
                end: end.unwrap_or(start.unwrap_or(1)),
''',
              '',
          )
          text = once(
              text,
              '''    let value = lines[start - 1..end].join("\\n");
    (value.clone(), value.len())''',
              '''    let value = lines[start - 1..end].join("\\n");
    let bytes = value.len();
    (value, bytes)''',
              'line slice clone',
          )
          text = once(
              text,
              '        let extra = line.len() + usize::from(!selected.is_empty());',
              '        let extra = line.len() + if selected.is_empty() { 0 } else { 1 };',
              'line budget separator',
          )
          context.write_text(text)
          PY

          cargo fmt --all

      - name: Persist wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context.rs src/mcp.rs
          if ! git diff --cached --quiet; then
            git commit -m "feat: expose graph-ranked context packs over MCP"
            git push origin HEAD:${{ github.head_ref }}
          fi
