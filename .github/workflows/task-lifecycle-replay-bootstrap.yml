name: Task Lifecycle Replay Bootstrap
on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'feat/task-git-pr-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Preserve provider idempotency on lifecycle replay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/task_lifecycle.rs')
          text = p.read_text()
          old = '''    if let Some(number) = lifecycle.issue_number {
                  return Ok(TaskIssueResult {
                      lifecycle,
                      issue: github::GitHubIssue {
                          number,
                          title: req.title,
                          url: String::new(),
                      },
                      replayed: true,
                  });
              }
              let issue = state
          '''
          new = '''    let replayed = lifecycle.issue_number.is_some();
              let issue = state
          '''
          if old not in text:
              raise SystemExit('issue replay block not found')
          text = text.replace(old, new, 1)

          old = '''    sqlx::query(
                  "UPDATE task_lifecycle SET issue_number=?1, updated_at=unixepoch() WHERE task_id=?2",
              )
              .bind(i64::try_from(issue.number).map_err(|_| {
                  AppError::InvalidRequest("issue number exceeds SQLite integer range".into())
              })?)
              .bind(&req.task_id)
              .execute(&state.db)
              .await?;
              record_event(
                  state,
                  &req.task_id,
                  "github_issue_created",
                  serde_json::json!({ "issue_number": issue.number }),
              )
              .await?;
              Ok(TaskIssueResult {
                  lifecycle: load_view(state, &req.task_id).await?,
                  issue,
                  replayed: false,
              })
          '''
          new = '''    if let Some(existing) = lifecycle.issue_number {
                  if existing != issue.number {
                      return Err(AppError::InvalidRequest(
                          "provider idempotency replay returned a different issue number".into(),
                      ));
                  }
              } else {
                  sqlx::query(
                      "UPDATE task_lifecycle SET issue_number=?1, updated_at=unixepoch() WHERE task_id=?2",
                  )
                  .bind(i64::try_from(issue.number).map_err(|_| {
                      AppError::InvalidRequest("issue number exceeds SQLite integer range".into())
                  })?)
                  .bind(&req.task_id)
                  .execute(&state.db)
                  .await?;
                  record_event(
                      state,
                      &req.task_id,
                      "github_issue_created",
                      serde_json::json!({ "issue_number": issue.number }),
                  )
                  .await?;
              }
              Ok(TaskIssueResult {
                  lifecycle: load_view(state, &req.task_id).await?,
                  issue,
                  replayed,
              })
          '''
          if old not in text:
              raise SystemExit('issue persist block not found')
          text = text.replace(old, new, 1)

          old = '''    if let Some(number) = lifecycle.pull_number {
                  let pull = state
                      .github_pull_get(GitHubPullGetRequest {
                          workspace: snapshot.task.workspace,
                          pull_number: number,
                      })
                      .await?;
                  return Ok(TaskPullResult {
                      lifecycle,
                      pull,
                      replayed: true,
                  });
              }
              let pull = state
          '''
          new = '''    if at_least(&lifecycle.phase, "merged") {
                  let number = lifecycle.pull_number.ok_or_else(|| {
                      AppError::InvalidRequest("merged task lifecycle has no pull request".into())
                  })?;
                  let pull = state
                      .github_pull_get(GitHubPullGetRequest {
                          workspace: snapshot.task.workspace,
                          pull_number: number,
                      })
                      .await?;
                  return Ok(TaskPullResult {
                      lifecycle,
                      pull,
                      replayed: true,
                  });
              }
              let replayed = lifecycle.pull_number.is_some();
              let pull = state
          '''
          if old not in text:
              raise SystemExit('pull replay block not found')
          text = text.replace(old, new, 1)
          text = text.replace('expected_head: push_sha,', 'expected_head: push_sha,', 1)

          old = '''    sqlx::query(
                  "UPDATE task_lifecycle SET phase='pr_open', pull_number=?1, pull_head_sha=?2, updated_at=unixepoch() WHERE task_id=?3",
              )
              .bind(i64::try_from(pull.number).map_err(|_| AppError::InvalidRequest("pull number exceeds SQLite integer range".into()))?)
              .bind(&pull.head_sha)
              .bind(&req.task_id)
              .execute(&state.db)
              .await?;
              record_event(
                  state,
                  &req.task_id,
                  "pull_opened",
                  serde_json::json!({ "pull_number": pull.number, "head_sha": pull.head_sha }),
              )
              .await?;
              Ok(TaskPullResult {
                  lifecycle: load_view(state, &req.task_id).await?,
                  pull,
                  replayed: false,
              })
          '''
          new = '''    if let Some(existing) = lifecycle.pull_number {
                  if existing != pull.number {
                      return Err(AppError::InvalidRequest(
                          "provider idempotency replay returned a different pull request number".into(),
                      ));
                  }
              } else {
                  sqlx::query(
                      "UPDATE task_lifecycle SET phase='pr_open', pull_number=?1, pull_head_sha=?2, updated_at=unixepoch() WHERE task_id=?3",
                  )
                  .bind(i64::try_from(pull.number).map_err(|_| AppError::InvalidRequest("pull number exceeds SQLite integer range".into()))?)
                  .bind(&pull.head_sha)
                  .bind(&req.task_id)
                  .execute(&state.db)
                  .await?;
                  record_event(
                      state,
                      &req.task_id,
                      "pull_opened",
                      serde_json::json!({ "pull_number": pull.number, "head_sha": pull.head_sha }),
                  )
                  .await?;
              }
              Ok(TaskPullResult {
                  lifecycle: load_view(state, &req.task_id).await?,
                  pull,
                  replayed,
              })
          '''
          if old not in text:
              raise SystemExit('pull persist block not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
          cargo fmt --all
      - name: Persist replay hardening only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/task_lifecycle.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve task provider idempotency on replay"
            git push origin HEAD:${{ github.head_ref }}
          fi
