name: Harness Job Integration Patch

on:
  push:
    branches: [feat/178-harness-job-runtime]
    paths:
      - scripts/patch-harness-job-phase6.py
      - .github/workflows/harness-job-integration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/178-harness-job-runtime
          fetch-depth: 0

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0

      - name: Apply Phase 6 source patch
        run: |
          python scripts/patch-harness-job-phase6.py
          cargo fmt --all
          git diff --check

      - name: Commit source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mcp_process_plugin.rs src/harness_tool_pipeline.rs src/harness_job.rs
          git commit -m "feat(harness): expose durable job control"
          git push origin HEAD:feat/178-harness-job-runtime
