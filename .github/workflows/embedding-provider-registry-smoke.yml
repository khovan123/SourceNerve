name: Embedding Provider Registry Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedding-provider-registry-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  SMOKE_CONTAINER: sourcenerve-embedding-registry-${{ github.run_id }}-${{ github.run_attempt }}
  SMOKE_IMAGE: sourcenerve:embedding-registry-${{ github.run_id }}-${{ github.run_attempt }}
  BEARER_TOKEN: ci-embedding-registry-token-0123456789abcdef
  PROVIDERS_JSON: '[{"id":"local-a","kind":"executable","model":"fixture-a","executable":"/providers/embed.sh","args":[]},{"id":"local-b","kind":"executable","model":"fixture-b","executable":"/providers/embed.sh","args":[]}]'

jobs:
  embedding-provider-registry-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: docker build --build-arg SOURCENERVE_BUILD_COMMIT="${GITHUB_SHA}" -t "$SMOKE_IMAGE" .

      - name: Prepare repository and executable provider fixture
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-embedding-registry"
          mkdir -p "$SMOKE/repo/src" "$SMOKE/remote.git" "$SMOKE/state" "$SMOKE/config" "$SMOKE/providers" "$SMOKE/provider-state"
          git -C "$SMOKE/remote.git" init --bare
          git -C "$SMOKE/repo" init -b main
          git -C "$SMOKE/repo" config user.name "SourceNerve CI"
          git -C "$SMOKE/repo" config user.email "ci@example.invalid"
          cat > "$SMOKE/repo/src/billing.rs" <<'RS'
          pub fn billing_reconciliation_total() -> u64 {
              42
          }
          RS
          git -C "$SMOKE/repo" add .
          git -C "$SMOKE/repo" commit -m "embedding provider registry fixture"
          git -C "$SMOKE/repo" remote add origin ../remote.git
          git -C "$SMOKE/repo" push -u origin main

          cat > "$SMOKE/providers/embed.sh" <<'SH'
          #!/bin/sh
          set -eu
          body="$(cat)"
          printf 'call\n' >> /provider-state/calls
          case "$body" in
            *billing*|*Billing*) vector='[1.0,0.0,0.0]' ;;
            *) vector='[0.0,1.0,0.0]' ;;
          esac
          printf '{"data":[{"index":0,"embedding":%s}]}\n' "$vector"
          SH
          chmod 0755 "$SMOKE/providers/embed.sh"

          cat > "$SMOKE/config/sourcenerve.toml" <<'TOML'
          [server]
          bind = "0.0.0.0:7331"
          [storage]
          state_dir = "/state"
          [auth]
          bearer_token = "placeholder-token-overridden"
          [[workspace]]
          id = "registry"
          name = "Registry Fixture"
          root = "/smoke/repo"
          access = "read-only"
          remote = "origin"
          default_branch = "main"
          TOML
          chmod -R a+rX "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/config" "$SMOKE/providers"
          chmod 0777 "$SMOKE/state" "$SMOKE/provider-state"

      - name: Start production container with two configured providers
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-embedding-registry"
          docker run -d --name "$SMOKE_CONTAINER" -p 127.0.0.1::7331 \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN="$BEARER_TOKEN" \
            -e SOURCENERVE_EMBEDDING_PROVIDERS_JSON="$PROVIDERS_JSON" \
            -e SOURCENERVE_EMBEDDING_DEFAULT_PROVIDER=local-a \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" -v "$SMOKE/repo:/smoke/repo:ro" \
            -v "$SMOKE/remote.git:/smoke/remote.git:ro" -v "$SMOKE/state:/state" \
            -v "$SMOKE/providers:/providers:ro" -v "$SMOKE/provider-state:/provider-state" \
            "$SMOKE_IMAGE"
          ENDPOINT="$(docker port "$SMOKE_CONTAINER" 7331/tcp | head -n1)"; PORT="${ENDPOINT##*:}"
          printf '%s\n' "$PORT" > "$RUNNER_TEMP/embedding-registry-port"
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${PORT}/healthz" >/dev/null && exit 0
            sleep 1
          done
          docker logs "$SMOKE_CONTAINER"
          exit 1

      - name: Exercise provider selection, replay and context
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-embedding-registry"
          PORT="$(cat "$RUNNER_TEMP/embedding-registry-port")"; BASE="http://127.0.0.1:${PORT}"
          AUTH="Authorization: Bearer $BEARER_TOKEN"; OUT="$RUNNER_TEMP/embedding-registry-out"; mkdir -p "$OUT"

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"registry"}' "$BASE/api/v1/index" > "$OUT/index.json"

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{}' "$BASE/api/v1/semantic/providers/status" > "$OUT/providers.json"
          python3 - "$OUT/providers.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['configured'] is True, p
          assert p['default_provider']=='local-a', p
          assert [(x['id'],x['model'],x['kind'],x['is_default']) for x in p['providers']] == [
              ('local-a','fixture-a','executable',True),
              ('local-b','fixture-b','executable',False),
          ], p
          raw=open(sys.argv[1]).read()
          for sentinel in ['/providers','embed.sh','/bin/sh','provider-state']:
              assert sentinel not in raw, (sentinel,raw)
          PY

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"registry","client_run_id":"registry:v1","max_chunks":8,"provider_id":"local-a"}' \
            "$BASE/api/v1/semantic/provider/index" > "$OUT/import.json"
          python3 - "$OUT/import.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v['replayed'] is False, v
          assert v['run']['provider']=='local-a' and v['run']['model']=='fixture-a', v
          assert v['imported_chunks']==1, v
          PY
          test "$(wc -l < "$SMOKE/provider-state/calls")" -eq 1

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"registry","client_run_id":"registry:v1","max_chunks":8,"provider_id":"local-a"}' \
            "$BASE/api/v1/semantic/provider/index" > "$OUT/replay.json"
          python3 - "$OUT/replay.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1])); assert v['replayed'] is True, v
          PY
          test "$(wc -l < "$SMOKE/provider-state/calls")" -eq 1

          code="$(curl -sS -o "$OUT/conflict.json" -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"registry","client_run_id":"registry:v1","max_chunks":8,"provider_id":"local-b"}' \
            "$BASE/api/v1/semantic/provider/index")"
          test "$code" = 400
          test "$(wc -l < "$SMOKE/provider-state/calls")" -eq 1

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"registry","query":"billing reconciliation","limit":5,"provider_id":"local-a"}' \
            "$BASE/api/v1/semantic/search-text" > "$OUT/search.json"
          python3 - "$OUT/search.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v['hits'][0]['path']=='src/billing.rs', v
          assert v['hits'][0]['score'] > .9999, v
          assert v['hits'][0]['provider']=='local-a', v
          PY
          test "$(wc -l < "$SMOKE/provider-state/calls")" -eq 2

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"registry","query":"billing reconciliation","seed_symbol_keys":[],"seed_cluster_keys":[],"max_bytes":65536,"max_items":10,"require_clean":true,"provider_semantic":true}' \
            "$BASE/api/v1/context/pack" > "$OUT/context.json"
          python3 - "$OUT/context.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert any(i['path']=='src/billing.rs' for i in v['items']), v
          assert any(r['signal']=='semantic-vector' for i in v['items'] for r in i['reasons']), v
          PY
          test "$(wc -l < "$SMOKE/provider-state/calls")" -eq 3

          code="$(curl -sS -o "$OUT/unknown.json" -w '%{http_code}' -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"registry","query":"billing","limit":5,"provider_id":"missing"}' \
            "$BASE/api/v1/semantic/search-text")"
          test "$code" = 400
          test "$(wc -l < "$SMOKE/provider-state/calls")" -eq 3

          curl -fsS -H "$AUTH" "$BASE/api/v1/status" > "$OUT/status.json"
          python3 - "$OUT/status.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert 'embedding-provider-registry' in v['identity']['capabilities'], v
          PY

      - name: Verify MCP schemas expose provider selection
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/embedding-registry-port")"; BASE="http://127.0.0.1:${PORT}"
          HDR="$RUNNER_TEMP/embedding-registry-mcp-headers"
          curl -fsS -D "$HDR" -H "Authorization: Bearer $BEARER_TOKEN" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"registry-smoke","version":"1"}}}' \
            "${BASE}/mcp" > "$RUNNER_TEMP/mcp-init.txt"
          SESSION="$(awk 'BEGIN{IGNORECASE=1} /^mcp-session-id:/ {gsub("\r",""); print $2}' "$HDR" | tail -1)"
          test -n "$SESSION"
          curl -fsS -H "Authorization: Bearer $BEARER_TOKEN" -H "mcp-session-id: $SESSION" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' "${BASE}/mcp" >/dev/null
          curl -fsS -H "Authorization: Bearer $BEARER_TOKEN" -H "mcp-session-id: $SESSION" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "${BASE}/mcp" > "$RUNNER_TEMP/mcp-tools.txt"
          python3 - "$RUNNER_TEMP/mcp-tools.txt" <<'PY'
          import json,sys
          raw=open(sys.argv[1]).read()
          payload=next(line[6:] for line in raw.splitlines() if line.startswith('data: ')) if 'data: ' in raw else raw
          v=json.loads(payload)
          tools={t['name']:t for t in v['result']['tools']}
          for name in ['semantic_provider_index','semantic_search_text']:
              assert name in tools, tools.keys()
              props=tools[name]['inputSchema'].get('properties',{})
              assert 'provider_id' in props, (name,props)
          PY

      - name: Restart and rebuild provider runtime from operator config
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-embedding-registry"
          docker rm -f "$SMOKE_CONTAINER" >/dev/null
          docker run -d --name "$SMOKE_CONTAINER" -p 127.0.0.1::7331 \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN="$BEARER_TOKEN" \
            -e SOURCENERVE_EMBEDDING_PROVIDERS_JSON="$PROVIDERS_JSON" \
            -e SOURCENERVE_EMBEDDING_DEFAULT_PROVIDER=local-a \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" -v "$SMOKE/repo:/smoke/repo:ro" \
            -v "$SMOKE/remote.git:/smoke/remote.git:ro" -v "$SMOKE/state:/state" \
            -v "$SMOKE/providers:/providers:ro" -v "$SMOKE/provider-state:/provider-state" \
            "$SMOKE_IMAGE"
          ENDPOINT="$(docker port "$SMOKE_CONTAINER" 7331/tcp | head -n1)"; PORT="${ENDPOINT##*:}"; BASE="http://127.0.0.1:${PORT}"
          for _ in $(seq 1 30); do curl -fsS "$BASE/healthz" >/dev/null && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer $BEARER_TOKEN" -H 'Content-Type: application/json' \
            -d '{"workspace":"registry","query":"billing reconciliation","limit":5,"provider_id":"local-a"}' \
            "$BASE/api/v1/semantic/search-text" > "$RUNNER_TEMP/restart-search.json"
          python3 - "$RUNNER_TEMP/restart-search.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1])); assert v['hits'][0]['path']=='src/billing.rs', v
          PY

      - name: Logs and cleanup
        if: always()
        run: |
          docker logs "$SMOKE_CONTAINER" || true
          docker rm -f "$SMOKE_CONTAINER" || true
          docker image rm "$SMOKE_IMAGE" >/dev/null 2>&1 || true
