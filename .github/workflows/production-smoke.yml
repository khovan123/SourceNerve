name: Production Smoke
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sourcenerve-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-smoke:
    runs-on:
      - self-hosted
      - linux
      - x64
    env:
      SMOKE_CONTAINER: sourcenerve-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: sourcenerve:production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Build production image with build identity
        run: |
          docker build \
            --build-arg SOURCENERVE_BUILD_COMMIT="${GITHUB_SHA}" \
            -t "$SMOKE_IMAGE" .

      - name: Prepare smoke workspace
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-release-smoke"
          mkdir -p "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/state" "$SMOKE/config"

          git -C "$SMOKE/remote.git" init --bare
          git -C "$SMOKE/repo" init -b main
          git -C "$SMOKE/repo" config user.name "SourceNerve CI"
          git -C "$SMOKE/repo" config user.email "ci@example.invalid"
          printf 'pub fn smoke() -> bool { true }\n' > "$SMOKE/repo/lib.rs"
          git -C "$SMOKE/repo" add lib.rs
          git -C "$SMOKE/repo" commit -m "smoke fixture"
          git -C "$SMOKE/repo" remote add origin ../remote.git
          git -C "$SMOKE/repo" push -u origin main

          cat > "$SMOKE/config/sourcenerve.toml" <<'EOF'
          [server]
          bind = "0.0.0.0:7331"

          [storage]
          state_dir = "/state"

          [auth]
          bearer_token = "ci-placeholder-token-overridden-by-env"

          [[workspace]]
          id = "smoke"
          name = "Smoke Repository"
          root = "/smoke/repo"
          access = "read-only"
          remote = "origin"
          default_branch = "main"
          EOF

          chmod -R a+rX "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/config"
          chmod 0777 "$SMOKE/state"

      - name: Start production container
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-release-smoke"
          docker run -d --name "$SMOKE_CONTAINER" \
            -p 127.0.0.1::7331 \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN=ci-smoke-bearer-token-0123456789abcdef \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" \
            -v "$SMOKE/repo:/smoke/repo:ro" \
            -v "$SMOKE/remote.git:/smoke/remote.git:ro" \
            -v "$SMOKE/state:/state" \
            "$SMOKE_IMAGE"

          HOST_ENDPOINT="$(docker port "$SMOKE_CONTAINER" 7331/tcp | head -n 1)"
          HOST_PORT="${HOST_ENDPOINT##*:}"
          case "$HOST_PORT" in
            ''|*[!0-9]*)
              echo "Unable to resolve smoke port from: $HOST_ENDPOINT" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$HOST_PORT" > "$RUNNER_TEMP/sourcenerve-smoke-port"

      - name: Smoke HTTP identity readiness and backup
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-smoke-port")"
          BASE="http://127.0.0.1:${PORT}"
          HEALTH="$RUNNER_TEMP/health.json"
          STATUS="$RUNNER_TEMP/status.json"
          READINESS="$RUNNER_TEMP/readiness.json"
          BACKUP_JSON="$RUNNER_TEMP/backup.json"
          BACKUP_VALIDATE="$RUNNER_TEMP/backup-validate.json"
          VALIDATE_REQUEST="$RUNNER_TEMP/validate-request.json"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "$BASE/healthz" >"$HEALTH"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$SMOKE_CONTAINER"
            exit 1
          fi

          AUTH='Authorization: Bearer ci-smoke-bearer-token-0123456789abcdef'
          curl -fsS -H "$AUTH" "$BASE/api/v1/status" >"$STATUS"
          curl -fsS -H "$AUTH" "$BASE/api/v1/readiness" >"$READINESS"
          curl -fsS -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"retain":2}' \
            "$BASE/api/v1/state/backup" >"$BACKUP_JSON"

          BACKUP=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["backup"])' "$BACKUP_JSON")
          python3 - "$BACKUP" > "$VALIDATE_REQUEST" <<'PY'
          import json, sys
          print(json.dumps({"backup": sys.argv[1]}))
          PY
          curl -fsS -H "$AUTH" \
            -H 'Content-Type: application/json' \
            --data-binary @"$VALIDATE_REQUEST" \
            "$BASE/api/v1/state/backup/validate" >"$BACKUP_VALIDATE"

          python3 - "$HEALTH" "$STATUS" "$READINESS" "$BACKUP_JSON" "$BACKUP_VALIDATE" <<'PY'
          import json, os, sys
          health = json.load(open(sys.argv[1]))
          status = json.load(open(sys.argv[2]))
          readiness = json.load(open(sys.argv[3]))
          backup = json.load(open(sys.argv[4]))
          validated = json.load(open(sys.argv[5]))
          expected = os.environ['GITHUB_SHA']
          assert health['status'] == 'ok', health
          assert health['build_commit'] == expected, health
          assert status['identity']['build_commit'] == expected, status
          assert status['identity']['service'] == 'sourcenerve', status
          assert readiness['ready'] is True, readiness
          assert readiness['identity']['build_commit'] == expected, readiness
          assert all('root' not in workspace for workspace in readiness['workspaces']), readiness
          assert backup['backup'].startswith('backups/sourcenerve-'), backup
          assert backup['bytes'] > 0, backup
          assert validated['valid'] is True, validated
          assert validated['integrity'] == 'ok', validated
          assert validated['backup'] == backup['backup'], (validated, backup)
          PY

      - name: Smoke MCP initialize and tools list
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-smoke-port")"
          BASE="http://127.0.0.1:${PORT}"
          AUTH='Authorization: Bearer ci-smoke-bearer-token-0123456789abcdef'
          ACCEPT='Accept: application/json, text/event-stream'
          INIT_REQUEST="$RUNNER_TEMP/mcp-init-request.json"
          INIT_HEADERS="$RUNNER_TEMP/mcp-init.headers"
          INIT_RESPONSE="$RUNNER_TEMP/mcp-init.json"
          TOOLS_RESPONSE="$RUNNER_TEMP/mcp-tools.json"

          cat > "$INIT_REQUEST" <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"sourcenerve-ci","version":"1.0"}}}
          JSON

          curl -fsS -D "$INIT_HEADERS" -o "$INIT_RESPONSE" \
            -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' \
            --data-binary @"$INIT_REQUEST"

          SESSION=$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/ {gsub("\r", "", $2); print $2}' "$INIT_HEADERS" | tail -1)
          test -n "$SESSION"

          curl -fsS -o /dev/null \
            -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" -H "Mcp-Session-Id: $SESSION" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'

          curl -fsS -o "$TOOLS_RESPONSE" \
            -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" -H "Mcp-Session-Id: $SESSION" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'

          python3 - "$INIT_RESPONSE" "$TOOLS_RESPONSE" <<'PY'
          import json, sys
          init = json.load(open(sys.argv[1]))
          tools = json.load(open(sys.argv[2]))
          assert init['result']['protocolVersion'], init
          names = {tool['name'] for tool in tools['result']['tools']}
          expected = {
              'service_status',
              'readiness',
              'state_backup_create',
              'state_backup_validate',
              'git_branch_checkout',
              'git_commit',
              'git_push',
              'github_issue_create',
              'github_pull_create',
              'github_pull_merge',
          }
          missing = expected - names
          assert not missing, (missing, sorted(names))
          PY

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs "$SMOKE_CONTAINER" || true
          docker rm -f "$SMOKE_CONTAINER" || true
          docker image rm "$SMOKE_IMAGE" >/dev/null 2>&1 || true
