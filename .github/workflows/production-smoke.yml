name: Production Smoke
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sourcenerve-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_CONTAINER: sourcenerve-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: sourcenerve:production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Build production image with build identity
        run: |
          docker build \
            --build-arg SOURCENERVE_BUILD_COMMIT="${GITHUB_SHA}" \
            -t "$SMOKE_IMAGE" .

      - name: Prepare smoke workspace
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-release-smoke"
          mkdir -p "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/state" "$SMOKE/config"

          git -C "$SMOKE/remote.git" init --bare
          git -C "$SMOKE/repo" init -b main
          git -C "$SMOKE/repo" config user.name "SourceNerve CI"
          git -C "$SMOKE/repo" config user.email "ci@example.invalid"
          printf 'pub fn smoke() -> bool { true }\n' > "$SMOKE/repo/lib.rs"
          git -C "$SMOKE/repo" add lib.rs
          git -C "$SMOKE/repo" commit -m "smoke fixture"
          git -C "$SMOKE/repo" remote add origin ../remote.git
          git -C "$SMOKE/repo" push -u origin main

          cat > "$SMOKE/config/sourcenerve.toml" <<'EOF'
          [server]
          bind = "0.0.0.0:7331"

          [storage]
          state_dir = "/state"

          [auth]
          bearer_token = "ci-placeholder-token-overridden-by-env"

          [[workspace]]
          id = "smoke"
          name = "Smoke Repository"
          root = "/smoke/repo"
          access = "read-only"
          remote = "origin"
          default_branch = "main"
          EOF

          chmod -R a+rX "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/config"
          chmod 0777 "$SMOKE/state"

      - name: Start production container
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-release-smoke"
          docker run -d --name "$SMOKE_CONTAINER" \
            -p 127.0.0.1::7331 \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN=ci-smoke-bearer-token-0123456789abcdef \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" \
            -v "$SMOKE/repo:/smoke/repo:ro" \
            -v "$SMOKE/remote.git:/smoke/remote.git:ro" \
            -v "$SMOKE/state:/state" \
            "$SMOKE_IMAGE"

          HOST_ENDPOINT="$(docker port "$SMOKE_CONTAINER" 7331/tcp | head -n 1)"
          HOST_PORT="${HOST_ENDPOINT##*:}"
          case "$HOST_PORT" in
            ''|*[!0-9]*)
              echo "Unable to resolve smoke port from: $HOST_ENDPOINT" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$HOST_PORT" > "$RUNNER_TEMP/sourcenerve-smoke-port"

      - name: Smoke HTTP identity readiness backup SCIP context pack and tasks
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-smoke-port")"
          BASE="http://127.0.0.1:${PORT}"
          HEALTH="$RUNNER_TEMP/health.json"
          STATUS="$RUNNER_TEMP/status.json"
          READINESS="$RUNNER_TEMP/readiness.json"
          SCIP_STATUS="$RUNNER_TEMP/scip-status.json"
          INDEX_RESULT="$RUNNER_TEMP/index-result.json"
          CONTEXT_PACK="$RUNNER_TEMP/context-pack.json"
          TASK_BEGIN="$RUNNER_TEMP/task-begin.json"
          TASK_GET="$RUNNER_TEMP/task-get.json"
          BACKUP_JSON="$RUNNER_TEMP/backup.json"
          BACKUP_VALIDATE="$RUNNER_TEMP/backup-validate.json"
          VALIDATE_REQUEST="$RUNNER_TEMP/validate-request.json"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "$BASE/healthz" >"$HEALTH"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$SMOKE_CONTAINER"
            exit 1
          fi

          AUTH='Authorization: Bearer ci-smoke-bearer-token-0123456789abcdef'
          curl -fsS -H "$AUTH" "$BASE/api/v1/status" >"$STATUS"
          curl -fsS -H "$AUTH" "$BASE/api/v1/readiness" >"$READINESS"
          curl -fsS -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke"}' \
            "$BASE/api/v1/graph/scip/status" >"$SCIP_STATUS"
          curl -fsS -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke"}' \
            "$BASE/api/v1/index" >"$INDEX_RESULT"
          curl -fsS -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke","query":"smoke","seed_symbol_keys":[],"max_bytes":4096,"max_items":5,"require_clean":true}' \
            "$BASE/api/v1/context/pack" >"$CONTEXT_PACK"
          curl -fsS -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke","client_request_id":"smoke:task","context_query":"smoke","context_max_bytes":4096,"context_max_items":5}' \
            "$BASE/api/v1/tasks/begin" >"$TASK_BEGIN"
          TASK_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["task"]["id"])' "$TASK_BEGIN")
          curl -fsS -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d "{\"task_id\":\"$TASK_ID\"}" \
            "$BASE/api/v1/tasks/get" >"$TASK_GET"
          curl -fsS -H "$AUTH" \
            -H 'Content-Type: application/json' \
            -d '{"retain":2}' \
            "$BASE/api/v1/state/backup" >"$BACKUP_JSON"

          BACKUP=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["backup"])' "$BACKUP_JSON")
          python3 - "$BACKUP" > "$VALIDATE_REQUEST" <<'PY'
          import json, sys
          print(json.dumps({"backup": sys.argv[1]}))
          PY
          curl -fsS -H "$AUTH" \
            -H 'Content-Type: application/json' \
            --data-binary @"$VALIDATE_REQUEST" \
            "$BASE/api/v1/state/backup/validate" >"$BACKUP_VALIDATE"

          python3 - "$HEALTH" "$STATUS" "$READINESS" "$SCIP_STATUS" "$INDEX_RESULT" "$CONTEXT_PACK" "$TASK_BEGIN" "$TASK_GET" "$BACKUP_JSON" "$BACKUP_VALIDATE" <<'PY'
          import json, os, sys
          health = json.load(open(sys.argv[1]))
          status = json.load(open(sys.argv[2]))
          readiness = json.load(open(sys.argv[3]))
          scip = json.load(open(sys.argv[4]))
          indexed = json.load(open(sys.argv[5]))
          context = json.load(open(sys.argv[6]))
          task_begin = json.load(open(sys.argv[7]))
          task_get = json.load(open(sys.argv[8]))
          backup = json.load(open(sys.argv[9]))
          validated = json.load(open(sys.argv[10]))
          expected = os.environ['GITHUB_SHA']
          assert health['status'] == 'ok', health
          assert health['build_commit'] == expected, health
          assert status['identity']['build_commit'] == expected, status
          assert status['identity']['service'] == 'sourcenerve', status
          assert status['identity']['state_schema_version'] >= 13, status
          assert 'context-pack' in status['identity']['capabilities'], status
          assert 'task-transactions' in status['identity']['capabilities'], status
          assert 'task-git-pr-lifecycle' in status['identity']['capabilities'], status
          assert 'github-webhook-observations' in status['identity']['capabilities'], status
          assert 'durable-outbound-callbacks' in status['identity']['capabilities'], status
          assert 'semantic-vector-enrichment' in status['identity']['capabilities'], status
          assert 'architecture-intelligence' in status['identity']['capabilities'], status
          assert 'distributed-mutation-coordination' in status['identity']['capabilities'], status
          assert readiness['ready'] is True, readiness
          assert readiness['identity']['build_commit'] == expected, readiness
          assert readiness['coordination']['mode'] == 'sqlite-fenced-leases', readiness
          assert all('root' not in workspace for workspace in readiness['workspaces']), readiness
          assert scip['workspace'] == 'smoke', scip
          assert scip['provider'] == 'scip', scip
          assert scip['active'] is False, scip
          assert indexed['workspace'] == 'smoke', indexed
          assert context['workspace'] == 'smoke', context
          assert context['clean'] is True, context
          assert context['consistency'] == 'clean-head-index', context
          assert context['head'] == context['indexed_head'], context
          assert context['used_bytes'] <= context['max_bytes'], context
          assert context['items'], context
          assert context['items'][0]['path'] == 'lib.rs', context
          assert context['items'][0]['sha256'], context
          assert task_begin['replayed'] is False, task_begin
          assert task_begin['task']['workspace'] == 'smoke', task_begin
          assert task_begin['task']['status'] == 'active', task_begin
          assert task_begin['task']['base_head'] == context['head'], (task_begin, context)
          assert task_begin['task']['graph_version'] == context['graph_version'], (task_begin, context)
          assert task_begin['task']['context_sha256'], task_begin
          assert task_begin['context']['items'], task_begin
          assert task_get['task']['id'] == task_begin['task']['id'], (task_get, task_begin)
          assert task_get['task']['status'] == 'active', task_get
          assert task_get['lifecycle']['phase'] == 'snapshot', task_get
          assert task_get['github_observation'] is None, task_get
          assert task_get['proposals'] == [], task_get
          assert [event['event_type'] for event in task_get['events']] == ['task_begun'], task_get
          assert backup['backup'].startswith('backups/sourcenerve-'), backup
          assert backup['bytes'] > 0, backup
          assert validated['valid'] is True, validated
          assert validated['integrity'] == 'ok', validated
          assert validated['backup'] == backup['backup'], (validated, backup)
          PY

      - name: Smoke MCP initialize and tools list
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-smoke-port")"
          BASE="http://127.0.0.1:${PORT}"
          AUTH='Authorization: Bearer ci-smoke-bearer-token-0123456789abcdef'
          ACCEPT='Accept: application/json, text/event-stream'
          PROTOCOL='2025-06-18'
          INIT_REQUEST="$RUNNER_TEMP/mcp-init-request.json"
          INIT_HEADERS="$RUNNER_TEMP/mcp-init.headers"
          INIT_RESPONSE="$RUNNER_TEMP/mcp-init.json"
          TOOLS_RESPONSE="$RUNNER_TEMP/mcp-tools.json"

          cat > "$INIT_REQUEST" <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"sourcenerve-ci","version":"1.0"}}}
          JSON

          curl -fsS -D "$INIT_HEADERS" -o "$INIT_RESPONSE" \
            -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' \
            --data-binary @"$INIT_REQUEST"

          SESSION=$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/ {gsub("\r", "", $2); print $2}' "$INIT_HEADERS" | tail -1)
          SESSION_HEADERS=()
          if [ -n "$SESSION" ]; then
            SESSION_HEADERS=(-H "Mcp-Session-Id: $SESSION")
          fi

          curl -fsS -o /dev/null \
            -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" \
            "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'

          curl -fsS -o "$TOOLS_RESPONSE" \
            -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" \
            "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'

          python3 scripts/normalize-mcp-response.py "$INIT_RESPONSE" "$TOOLS_RESPONSE"
          python3 - "$INIT_RESPONSE" "$TOOLS_RESPONSE" <<'PY'
          import json, sys
          init = json.load(open(sys.argv[1]))
          tools = json.load(open(sys.argv[2]))
          assert init['result']['protocolVersion'] == '2025-06-18', init
          names = {tool['name'] for tool in tools['result']['tools']}
          expected = {
              'service_status',
              'readiness',
              'state_backup_create',
              'state_backup_validate',
              'scip_status',
              'scip_import',
              'semantic_import',
              'semantic_search',
              'architecture_rebuild',
              'architecture_map',
              'architecture_cluster',
              'context_pack',
              'task_begin',
              'task_get',
              'task_cancel',
              'task_propose_patch',
              'task_apply_patch',
              'git_branch_checkout',
              'git_commit',
              'git_push',
              'github_issue_create',
              'github_pull_create',
              'github_pull_merge',
          }
          missing = expected - names
          assert not missing, (missing, sorted(names))
          PY

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs "$SMOKE_CONTAINER" || true
          docker rm -f "$SMOKE_CONTAINER" || true
          docker image rm "$SMOKE_IMAGE" >/dev/null 2>&1 || true
