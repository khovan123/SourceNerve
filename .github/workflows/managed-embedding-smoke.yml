name: Managed Embedding Smoke
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sourcenerve-managed-embedding-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  managed-embedding-smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_CONTAINER: sourcenerve-managed-embedding-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: sourcenerve:managed-embedding-${{ github.run_id }}-${{ github.run_attempt }}
      MANAGED_API_KEY: ci-managed-embedding-key-0123456789
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: |
          docker build \
            --build-arg SOURCENERVE_BUILD_COMMIT="${GITHUB_SHA}" \
            -t "$SMOKE_IMAGE" .

      - name: Prepare managed embedding smoke workspace
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-managed-embedding"
          mkdir -p "$SMOKE/repo/src" "$SMOKE/remote.git" "$SMOKE/state" "$SMOKE/config"

          git -C "$SMOKE/remote.git" init --bare
          git -C "$SMOKE/repo" init -b main
          git -C "$SMOKE/repo" config user.name "SourceNerve CI"
          git -C "$SMOKE/repo" config user.email "ci@example.invalid"
          cat > "$SMOKE/repo/src/billing.rs" <<'EOF'
          pub fn billing_reconciliation(invoice_total: i64) -> i64 {
              invoice_total + 7
          }
          EOF
          cat > "$SMOKE/repo/src/health.rs" <<'EOF'
          pub fn health_probe() -> bool {
              true
          }
          EOF
          cat > "$SMOKE/repo/src/lib.rs" <<'EOF'
          mod billing;
          mod health;
          EOF
          git -C "$SMOKE/repo" add -A
          git -C "$SMOKE/repo" commit -m "managed embedding fixture"
          git -C "$SMOKE/repo" remote add origin ../remote.git
          git -C "$SMOKE/repo" push -u origin main

          cat > "$SMOKE/config/sourcenerve.toml" <<'EOF'
          [server]
          bind = "127.0.0.1:7331"

          [storage]
          state_dir = "/state"

          [auth]
          bearer_token = "ci-placeholder-token-overridden-by-env"

          [[workspace]]
          id = "managed"
          name = "Managed Embedding Fixture"
          root = "/smoke/repo"
          access = "read-only"
          remote = "origin"
          default_branch = "main"
          EOF

          chmod -R a+rX "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/config"
          chmod 0777 "$SMOKE/state"

      - name: Start controlled fake embedding provider
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fake-embedding-provider.py" <<'PY'
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          KEY = os.environ["MANAGED_API_KEY"]
          COUNT_FILE = os.environ["COUNT_FILE"]

          def vector_for(text):
              lowered = text.lower()
              if "billing" in lowered:
                  return [1.0, 0.0, 0.0]
              if "health" in lowered:
                  return [0.0, 1.0, 0.0]
              return [0.0, 0.0, 1.0]

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return

              def do_POST(self):
                  if self.path != "/v1/embeddings":
                      self.send_error(404)
                      return
                  if self.headers.get("Authorization") != f"Bearer {KEY}":
                      self.send_error(401)
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  if length <= 0 or length > 600_000:
                      self.send_error(413)
                      return
                  payload = json.loads(self.rfile.read(length))
                  inputs = payload.get("input")
                  model = payload.get("model")
                  if not isinstance(inputs, list) or not inputs or not all(isinstance(v, str) for v in inputs):
                      self.send_error(400)
                      return
                  if model != "text-embedding-3-small":
                      self.send_error(400)
                      return
                  with open(COUNT_FILE, "a", encoding="utf-8") as handle:
                      handle.write("1\n")
                  data = [
                      {"object": "embedding", "index": index, "embedding": vector_for(text)}
                      for index, text in enumerate(inputs)
                  ]
                  data.reverse()
                  body = json.dumps({
                      "object": "list",
                      "model": model,
                      "data": data,
                      "usage": {"prompt_tokens": 1, "total_tokens": 1},
                  }).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

          ThreadingHTTPServer(("127.0.0.1", 7444), Handler).serve_forever()
          PY

          : > "$RUNNER_TEMP/managed-embedding-call-count"
          COUNT_FILE="$RUNNER_TEMP/managed-embedding-call-count" \
          MANAGED_API_KEY="$MANAGED_API_KEY" \
            python3 "$RUNNER_TEMP/fake-embedding-provider.py" \
            >"$RUNNER_TEMP/fake-embedding-provider.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fake-embedding-provider.pid"

          ready=0
          for _ in $(seq 1 20); do
            if python3 - <<'PY'
          import socket
          sock = socket.socket()
          try:
              sock.connect(("127.0.0.1", 7444))
          except OSError:
              raise SystemExit(1)
          finally:
              sock.close()
          PY
            then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1

      - name: Start production container with managed embeddings
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-managed-embedding"
          docker run -d --name "$SMOKE_CONTAINER" \
            --network host \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN=ci-managed-bearer-token-0123456789abcdef \
            -e SOURCENERVE_OPENAI_API_KEY="$MANAGED_API_KEY" \
            -e SOURCENERVE_OPENAI_EMBEDDING_MODEL=text-embedding-3-small \
            -e SOURCENERVE_OPENAI_EMBEDDING_URL=http://127.0.0.1:7444/v1/embeddings \
            -e SOURCENERVE_OPENAI_EMBEDDING_ALLOW_INSECURE_LOOPBACK=true \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" \
            -v "$SMOKE/repo:/smoke/repo:ro" \
            -v "$SMOKE/remote.git:/smoke/remote.git:ro" \
            -v "$SMOKE/state:/state" \
            "$SMOKE_IMAGE"

      - name: Verify managed index replay search and context
        run: |
          set -euo pipefail
          BASE='http://127.0.0.1:7331'
          AUTH='Authorization: Bearer ci-managed-bearer-token-0123456789abcdef'
          SMOKE="$RUNNER_TEMP/sourcenerve-managed-embedding"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "$BASE/healthz" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$SMOKE_CONTAINER"
            exit 1
          fi

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"managed"}' \
            "$BASE/api/v1/index" > "$RUNNER_TEMP/managed-index.json"

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"managed","client_run_id":"ci:managed:v1","max_chunks":32}' \
            "$BASE/api/v1/semantic/provider/index" > "$RUNNER_TEMP/provider-index-first.json"
          FIRST_COUNT=$(wc -l < "$RUNNER_TEMP/managed-embedding-call-count")
          test "$FIRST_COUNT" -ge 1

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"managed","client_run_id":"ci:managed:v1","max_chunks":32}' \
            "$BASE/api/v1/semantic/provider/index" > "$RUNNER_TEMP/provider-index-replay.json"
          REPLAY_COUNT=$(wc -l < "$RUNNER_TEMP/managed-embedding-call-count")
          test "$REPLAY_COUNT" -eq "$FIRST_COUNT"

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"managed","query":"managed-query-billing","limit":10}' \
            "$BASE/api/v1/semantic/search-text" > "$RUNNER_TEMP/search-text.json"

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"managed","query":"managed-query-billing","seed_symbol_keys":[],"seed_cluster_keys":[],"max_bytes":4096,"max_items":10,"require_clean":true,"provider_semantic":true}' \
            "$BASE/api/v1/context/pack" > "$RUNNER_TEMP/provider-context.json"

          curl -fsS -H "$AUTH" "$BASE/api/v1/status" > "$RUNNER_TEMP/managed-status.json"

          python3 - \
            "$RUNNER_TEMP/provider-index-first.json" \
            "$RUNNER_TEMP/provider-index-replay.json" \
            "$RUNNER_TEMP/search-text.json" \
            "$RUNNER_TEMP/provider-context.json" \
            "$RUNNER_TEMP/managed-status.json" <<'PY'
          import json, os, sys
          first = json.load(open(sys.argv[1]))
          replay = json.load(open(sys.argv[2]))
          search = json.load(open(sys.argv[3]))
          context = json.load(open(sys.argv[4]))
          status = json.load(open(sys.argv[5]))
          assert first['replayed'] is False, first
          assert first['run']['provider'] == 'openai', first
          assert first['run']['model'] == 'text-embedding-3-small', first
          assert first['run']['dimension'] == 3, first
          assert first['imported_chunks'] >= 2, first
          assert replay['replayed'] is True, replay
          assert replay['run']['id'] == first['run']['id'], (first, replay)
          assert search['run']['id'] == first['run']['id'], search
          assert search['hits'], search
          assert search['hits'][0]['path'] == 'src/billing.rs', search
          assert context['items'], context
          assert any(item['path'] == 'src/billing.rs' and any(reason['signal'] == 'semantic-vector' for reason in item['reasons']) for item in context['items']), context
          assert context['used_bytes'] <= context['max_bytes'], context
          assert status['identity']['state_schema_version'] >= 13, status
          assert 'managed-embeddings' in status['identity']['capabilities'], status
          encoded = json.dumps(status)
          assert os.environ['MANAGED_API_KEY'] not in encoded, status
          PY

          if grep -aF "$MANAGED_API_KEY" "$SMOKE/state/sourcenerve.db" >/dev/null; then
            echo 'managed embedding API key leaked into SQLite' >&2
            exit 1
          fi
          if grep -aF 'managed-query-billing' "$SMOKE/state/sourcenerve.db" >/dev/null; then
            echo 'managed semantic query text leaked into SQLite' >&2
            exit 1
          fi
          if docker exec "$SMOKE_CONTAINER" sh -c "find /tmp -maxdepth 1 -name '.sourcenerve-embedding-request-*' -print -quit | grep -q ."; then
            echo 'managed embedding temporary request body was not cleaned up' >&2
            exit 1
          fi

      - name: Verify MCP managed embedding tools
        run: |
          set -euo pipefail
          BASE='http://127.0.0.1:7331'
          AUTH='Authorization: Bearer ci-managed-bearer-token-0123456789abcdef'
          ACCEPT='Accept: application/json, text/event-stream'
          PROTOCOL='2025-06-18'
          INIT_HEADERS="$RUNNER_TEMP/managed-mcp-init.headers"
          INIT_RESPONSE="$RUNNER_TEMP/managed-mcp-init.json"
          TOOLS_RESPONSE="$RUNNER_TEMP/managed-mcp-tools.json"

          curl -fsS -D "$INIT_HEADERS" -o "$INIT_RESPONSE" \
            -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"managed-embedding-ci","version":"1.0"}}}'

          SESSION=$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/ {gsub("\r", "", $2); print $2}' "$INIT_HEADERS" | tail -1)
          SESSION_HEADERS=()
          if [ -n "$SESSION" ]; then
            SESSION_HEADERS=(-H "Mcp-Session-Id: $SESSION")
          fi

          curl -fsS -o /dev/null \
            -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" \
            "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'

          curl -fsS -o "$TOOLS_RESPONSE" \
            -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" \
            "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'

          python3 scripts/normalize-mcp-response.py "$TOOLS_RESPONSE"
          python3 - "$TOOLS_RESPONSE" <<'PY'
          import json, sys
          tools = json.load(open(sys.argv[1]))
          names = {tool['name'] for tool in tools['result']['tools']}
          expected = {'semantic_provider_index', 'semantic_search_text', 'context_pack'}
          assert not (expected - names), (expected - names, sorted(names))
          PY

      - name: Verify disabled provider fails closed and baseline stays local
        run: |
          set -euo pipefail
          BASE='http://127.0.0.1:7331'
          AUTH='Authorization: Bearer ci-managed-bearer-token-0123456789abcdef'
          SMOKE="$RUNNER_TEMP/sourcenerve-managed-embedding"
          BEFORE=$(wc -l < "$RUNNER_TEMP/managed-embedding-call-count")

          docker rm -f "$SMOKE_CONTAINER"
          docker run -d --name "$SMOKE_CONTAINER" \
            --network host \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN=ci-managed-bearer-token-0123456789abcdef \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" \
            -v "$SMOKE/repo:/smoke/repo:ro" \
            -v "$SMOKE/remote.git:/smoke/remote.git:ro" \
            -v "$SMOKE/state:/state" \
            "$SMOKE_IMAGE"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "$BASE/healthz" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          HTTP=$(curl -sS -o "$RUNNER_TEMP/provider-disabled.json" -w '%{http_code}' \
            -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"managed","client_run_id":"ci:managed:disabled","max_chunks":32}' \
            "$BASE/api/v1/semantic/provider/index")
          test "$HTTP" = '400'
          grep -F 'managed embeddings are disabled' "$RUNNER_TEMP/provider-disabled.json"

          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"managed","query":"billing","seed_symbol_keys":[],"seed_cluster_keys":[],"max_bytes":4096,"max_items":10,"require_clean":true}' \
            "$BASE/api/v1/context/pack" > "$RUNNER_TEMP/baseline-context-after-restart.json"
          python3 - "$RUNNER_TEMP/baseline-context-after-restart.json" <<'PY'
          import json, sys
          context = json.load(open(sys.argv[1]))
          assert context['items'], context
          assert context['used_bytes'] <= context['max_bytes'], context
          PY

          AFTER=$(wc -l < "$RUNNER_TEMP/managed-embedding-call-count")
          test "$AFTER" -eq "$BEFORE"

      - name: Logs and cleanup
        if: always()
        run: |
          docker logs "$SMOKE_CONTAINER" || true
          docker rm -f "$SMOKE_CONTAINER" || true
          docker image rm "$SMOKE_IMAGE" >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/fake-embedding-provider.log" || true
          if [ -f "$RUNNER_TEMP/fake-embedding-provider.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/fake-embedding-provider.pid")" >/dev/null 2>&1 || true
          fi