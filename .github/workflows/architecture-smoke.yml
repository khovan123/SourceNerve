name: Architecture Intelligence Smoke
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sourcenerve-architecture-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_CONTAINER: sourcenerve-architecture-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: sourcenerve:architecture-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      BEARER_TOKEN: ci-architecture-bearer-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v5

      - name: Build production image
        run: |
          docker build \
            --build-arg SOURCENERVE_BUILD_COMMIT="${GITHUB_SHA}" \
            -t "$SMOKE_IMAGE" .

      - name: Prepare architecture smoke workspace
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-architecture-smoke"
          mkdir -p "$SMOKE/repo/api" "$SMOKE/repo/domain" "$SMOKE/remote.git" "$SMOKE/state" "$SMOKE/config"
          git -C "$SMOKE/remote.git" init --bare
          git -C "$SMOKE/repo" init -b main
          git -C "$SMOKE/repo" config user.name "SourceNerve CI"
          git -C "$SMOKE/repo" config user.email "ci@example.invalid"
          cat > "$SMOKE/repo/api/handler.py" <<'PY'
          from domain.service import calculate

          def handler(value):
              return calculate(value)
          PY
          cat > "$SMOKE/repo/domain/service.py" <<'PY'
          def calculate(value):
              return value + 42
          PY
          printf '# architecture smoke\n' > "$SMOKE/repo/README.md"
          git -C "$SMOKE/repo" add .
          git -C "$SMOKE/repo" commit -m "architecture smoke fixture"
          git -C "$SMOKE/repo" remote add origin ../remote.git
          git -C "$SMOKE/repo" push -u origin main

          cat > "$SMOKE/config/sourcenerve.toml" <<'TOML'
          [server]
          bind = "0.0.0.0:7331"

          [storage]
          state_dir = "/state"

          [auth]
          bearer_token = "ci-placeholder-token-overridden-by-env"

          [[workspace]]
          id = "smoke"
          name = "Architecture Smoke Repository"
          root = "/smoke/repo"
          access = "read-only"
          remote = "origin"
          default_branch = "main"
          TOML

          chmod -R a+rX "$SMOKE/repo" "$SMOKE/remote.git" "$SMOKE/config"
          chmod 0777 "$SMOKE/state"

      - name: Start production container
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/sourcenerve-architecture-smoke"
          docker run -d --name "$SMOKE_CONTAINER" \
            -p 127.0.0.1::7331 \
            -e SOURCENERVE_CONFIG=/config/sourcenerve.toml \
            -e SOURCENERVE_BEARER_TOKEN="$BEARER_TOKEN" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/smoke/repo \
            -v "$SMOKE/config:/config:ro" \
            -v "$SMOKE/repo:/smoke/repo:ro" \
            -v "$SMOKE/remote.git:/smoke/remote.git:ro" \
            -v "$SMOKE/state:/state" \
            "$SMOKE_IMAGE"
          HOST_ENDPOINT="$(docker port "$SMOKE_CONTAINER" 7331/tcp | head -n 1)"
          PORT="${HOST_ENDPOINT##*:}"
          case "$PORT" in ''|*[!0-9]*) exit 1;; esac
          printf '%s\n' "$PORT" > "$RUNNER_TEMP/sourcenerve-architecture-smoke-port"

      - name: Verify rebuild replay map cluster and context seeding
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-architecture-smoke-port")"
          BASE="http://127.0.0.1:${PORT}"
          AUTH="Authorization: Bearer $BEARER_TOKEN"
          OUT="$RUNNER_TEMP/architecture-smoke-out"
          mkdir -p "$OUT"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "$BASE/healthz" > "$OUT/health.json"; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1

          curl -fsS -H "$AUTH" "$BASE/api/v1/status" > "$OUT/status.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke"}' "$BASE/api/v1/index" > "$OUT/index.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke"}' "$BASE/api/v1/architecture/rebuild" > "$OUT/rebuild.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke"}' "$BASE/api/v1/architecture/rebuild" > "$OUT/replay.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke","limit":20}' "$BASE/api/v1/architecture/map" > "$OUT/map.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke","cluster_key":"domain"}' "$BASE/api/v1/architecture/cluster" > "$OUT/cluster.json"
          curl -fsS -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workspace":"smoke","query":"handler","seed_symbol_keys":[],"seed_cluster_keys":["domain"],"max_bytes":4096,"max_items":10,"require_clean":true}' \
            "$BASE/api/v1/context/pack" > "$OUT/context.json"

          python3 - "$OUT/status.json" "$OUT/rebuild.json" "$OUT/replay.json" "$OUT/map.json" "$OUT/cluster.json" "$OUT/context.json" <<'PY'
          import json, sys
          status, first, replay, amap, cluster, context = [json.load(open(path)) for path in sys.argv[1:]]
          assert status['identity']['state_schema_version'] == 12, status
          assert 'architecture-intelligence' in status['identity']['capabilities'], status
          assert first['replayed'] is False, first
          assert first['cluster_count'] >= 3, first
          assert replay['replayed'] is True, replay
          assert replay['snapshot']['id'] == first['snapshot']['id'], (first, replay)
          assert replay['snapshot']['snapshot_hash'] == first['snapshot']['snapshot_hash'], (first, replay)
          assert amap['snapshot']['snapshot_hash'] == first['snapshot']['snapshot_hash'], amap
          keys = {item['cluster_key'] for item in amap['clusters']}
          assert {'api', 'domain'} <= keys, amap
          domain = next(item for item in amap['clusters'] if item['cluster_key'] == 'domain')
          assert 'domain/service.py' in domain['representative_files'], domain
          assert cluster['cluster']['cluster_key'] == 'domain', cluster
          assert cluster['snapshot']['snapshot_hash'] == first['snapshot']['snapshot_hash'], cluster
          domain_items = [item for item in context['items'] if item['path'] == 'domain/service.py']
          assert domain_items, context
          assert any(reason['signal'] == 'architecture-cluster' for reason in domain_items[0]['reasons']), domain_items[0]
          assert context['used_bytes'] <= context['max_bytes'], context
          encoded = json.dumps([first, replay, amap, cluster])
          assert '/smoke/repo' not in encoded, encoded
          PY

      - name: Verify MCP architecture tools
        run: |
          set -euo pipefail
          PORT="$(cat "$RUNNER_TEMP/sourcenerve-architecture-smoke-port")"
          BASE="http://127.0.0.1:${PORT}"
          AUTH="Authorization: Bearer $BEARER_TOKEN"
          ACCEPT='Accept: application/json, text/event-stream'
          PROTOCOL='2025-06-18'
          HEADERS="$RUNNER_TEMP/architecture-mcp.headers"
          TOOLS="$RUNNER_TEMP/architecture-mcp-tools.json"

          curl -fsS -D "$HEADERS" -o /dev/null -X POST "$BASE/mcp" \
            -H "$AUTH" -H "$ACCEPT" -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"architecture-ci","version":"1.0"}}}'
          SESSION=$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/ {gsub("\r", "", $2); print $2}' "$HEADERS" | tail -1)
          SESSION_HEADERS=()
          if [ -n "$SESSION" ]; then SESSION_HEADERS=(-H "Mcp-Session-Id: $SESSION"); fi
          curl -fsS -o /dev/null -X POST "$BASE/mcp" -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
          curl -fsS -o "$TOOLS" -X POST "$BASE/mcp" -H "$AUTH" -H "$ACCEPT" \
            -H "MCP-Protocol-Version: $PROTOCOL" "${SESSION_HEADERS[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          python3 - "$TOOLS" <<'PY'
          import json, sys
          names = {tool['name'] for tool in json.load(open(sys.argv[1]))['result']['tools']}
          expected = {'architecture_rebuild', 'architecture_map', 'architecture_cluster', 'context_pack'}
          assert expected <= names, (expected - names, sorted(names))
          PY

      - name: Logs and cleanup
        if: always()
        run: |
          docker logs "$SMOKE_CONTAINER" || true
          docker rm -f "$SMOKE_CONTAINER" || true
          docker image rm "$SMOKE_IMAGE" >/dev/null 2>&1 || true
