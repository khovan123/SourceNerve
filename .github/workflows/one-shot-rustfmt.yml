name: One-shot Rustfmt

on:
  push:
    branches:
      - fix/desktop-bootstrap-offline-recovery

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/desktop-bootstrap-offline-recovery
      - name: Install pinned Rustfmt
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rustfmt changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(rust): apply cargo fmt"
          git push origin HEAD:fix/desktop-bootstrap-offline-recovery
