name: Desktop Distribution

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop-distribution-smoke.yml"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sourcenerve-desktop-distribution-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.88.0
  SOURCENERVE_BEARER_TOKEN: DIST_CANARY_LOCAL_BEARER_76_0123456789abcdef
  SOURCENERVE_GITHUB_TOKEN: DIST_CANARY_GITHUB_TOKEN_76_0123456789abcdef
  SOURCENERVE_GITLAB_TOKEN: DIST_CANARY_GITLAB_TOKEN_76_0123456789abcdef
  SOURCENERVE_OPENAI_APPS_CHALLENGE: DIST_CANARY_OPENAI_CHALLENGE_76_0123456789abcdef

jobs:
  distribution:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora x64 RPM + AppImage
            os: ubuntu-latest
            arch: x64
            kind: linux
            artifact: desktop-fedora-x64
          - name: Windows x64 NSIS
            os: windows-latest
            arch: x64
            kind: windows
            artifact: desktop-windows-x64
          - name: macOS arm64 DMG + ZIP
            os: macos-latest
            arch: arm64
            kind: macos
            artifact: desktop-macos-arm64
          - name: macOS x64 DMG + ZIP
            os: macos-15-intel
            arch: x64
            kind: macos
            artifact: desktop-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Parse macOS production signing scripts
        if: matrix.kind == 'macos'
        run: |
          bash -n desktop/scripts/build-signed-macos-release.sh
          bash -n desktop/scripts/verify-macos-signing.sh

      - name: Parse Windows production signing scripts
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content desktop/scripts/sign-windows-release.ps1 -Raw))
          $null = [scriptblock]::Create((Get-Content desktop/scripts/verify-windows-signing.ps1 -Raw))

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0

      - name: Install Fedora/AppImage packaging tools
        if: matrix.kind == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot squashfs-tools

      - name: Install NSIS packaging tool
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\\Program Files (x86)\\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Use installable Desktop bootstrap profile
        working-directory: desktop
        run: node -e "require('node:fs').copyFileSync('.env.example', '.env')"

      - name: Materialize public release profile values
        working-directory: desktop
        run: node scripts/materialize-product-profile.mjs

      - name: Verify installable bootstrap profile
        working-directory: desktop
        run: node scripts/verify-installable-bootstrap-profile.mjs

      - name: Build Forge installer artifacts
        if: matrix.kind != 'windows'
        working-directory: desktop
        env:
          SOURCENERVE_RPM_REVISION: ${{ github.run_number }}.${{ github.run_attempt }}
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Build macOS DMG
        if: matrix.kind == 'macos'
        working-directory: desktop
        run: npm run make:dmg -- ${{ matrix.arch }}

      - name: Package Windows application
        if: matrix.kind == 'windows'
        working-directory: desktop
        run: npm run package -- --arch=${{ matrix.arch }}

      - name: Build Windows NSIS installer
        if: matrix.kind == 'windows'
        working-directory: desktop
        run: npm run make:nsis -- ${{ matrix.arch }}

      - name: Verify unpacked packaged payload
        working-directory: desktop
        run: npm run test:packaged

      - name: Verify installer artifact set
        working-directory: desktop
        env:
          SOURCENERVE_DISTRIBUTION_KIND: ${{ matrix.kind }}
        run: npm run test:distribution

      - name: Generate updater manifest
        working-directory: desktop
        env:
          SOURCENERVE_DISTRIBUTION_KIND: ${{ matrix.kind }}
        run: npm run update:manifest -- ${{ matrix.arch }}

      - name: Verify updater manifest
        working-directory: desktop
        env:
          SOURCENERVE_DISTRIBUTION_KIND: ${{ matrix.kind }}
        run: npm run test:update-manifest -- ${{ matrix.arch }}

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  publish-edge:
    name: Publish Desktop edge prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all Desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: edge-artifacts
          merge-multiple: false

      - name: Stage edge release assets without collisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p edge-upload
          while IFS= read -r -d '' candidate; do
            target="edge-upload/$(basename "$candidate")"
            if [ -e "$target" ]; then
              echo "::error::Duplicate edge release asset basename: $(basename "$candidate")"
              exit 1
            fi
            cp "$candidate" "$target"
          done < <(find edge-artifacts -type f \( -name '*.AppImage' -o -name '*.rpm' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.yml' \) -print0)
          test "$(find edge-upload -type f | wc -l)" -gt 0

      - name: Publish mutable Desktop edge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="desktop-edge"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          cat > edge-notes.md <<EOF
          Automated CI candidate from the default branch.

          Commit: $GITHUB_SHA

          Includes Fedora x64 RPM/AppImage, Windows x64 NSIS, macOS arm64 DMG/ZIP, macOS x64 DMG/ZIP, and updater manifests.

          This edge release is unsigned/non-notarized CI output. It uses the normal public SourceNerve bootstrap broker so installed candidates can complete account/bootstrap flows, but it is not the stable production release channel. Stable signed releases remain tag-driven as desktop-vX.Y.Z.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$tag" edge-upload/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "SourceNerve Desktop Edge" --prerelease --notes-file edge-notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "SourceNerve Desktop Edge" --prerelease --notes-file edge-notes.md edge-upload/*
          fi
