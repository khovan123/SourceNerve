name: Harness Job Clippy Patch

on:
  push:
    branches: [feat/178-harness-job-runtime]
    paths:
      - scripts/patch-harness-job-clippy.py
      - .github/workflows/harness-job-clippy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/178-harness-job-runtime
          fetch-depth: 0

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0

      - name: Apply Clippy cleanup
        run: |
          python scripts/patch-harness-job-clippy.py
          cargo fmt --all
          git diff --check

      - name: Commit Clippy cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/harness_job.rs
          git commit -m "fix(harness): remove unused job row fields"
          git push origin HEAD:feat/178-harness-job-runtime
