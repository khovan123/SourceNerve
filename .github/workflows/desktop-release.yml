name: Desktop Stable Release

on:
  push:
    tags:
      - "desktop-v*.*.*"
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: sourcenerve-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  validate:
    name: Validate stable release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Verify tag, Desktop, daemon, and bootstrap versions
        working-directory: desktop
        env:
          SOURCENERVE_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:contract

      - name: Verify Desktop bootstrap profile schema
        run: bash scripts/verify-desktop-bootstrap.sh

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --all-features

      - name: Verify Desktop security baseline
        working-directory: desktop
        run: npm run security:check

      - name: Block runtime dependency vulnerabilities
        working-directory: desktop
        run: node scripts/npm-audit-retry.mjs --omit=dev --audit-level=high

      - name: Review build-tool dependency advisories
        working-directory: desktop
        shell: bash
        run: |
          node scripts/npm-audit-retry.mjs --allow-advisories --output npm-audit.json
          node scripts/verify-dependency-audit.mjs npm-audit.json
          rm -f npm-audit.json

      - name: Typecheck Desktop
        working-directory: desktop
        run: npm run typecheck

      - name: Unit test Desktop
        working-directory: desktop
        run: npm test

      - name: Scan tracked source for supplied release secrets
        working-directory: desktop
        run: npm run release:secret-scan

  build:
    name: ${{ matrix.name }}
    needs: validate
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora x64 RPM + AppImage
            os: ubuntu-latest
            arch: x64
            kind: linux
            artifact: desktop-fedora-x64
    runs-on: ${{ matrix.os }}
    env:
      SOURCENERVE_RELEASE_ENVIRONMENT_PROTECTED: ${{ vars.SOURCENERVE_RELEASE_ENVIRONMENT_PROTECTED }}
      SOURCENERVE_BEARER_TOKEN: RELEASE_CANARY_LOCAL_BEARER_82_0123456789abcdef
      SOURCENERVE_GITHUB_TOKEN: RELEASE_CANARY_GITHUB_TOKEN_82_0123456789abcdef
      SOURCENERVE_GITLAB_TOKEN: RELEASE_CANARY_GITLAB_TOKEN_82_0123456789abcdef
      SOURCENERVE_OPENAI_APPS_CHALLENGE: RELEASE_CANARY_OPENAI_CHALLENGE_82_0123456789abcdef
    steps:
      - uses: actions/checkout@v5

      - name: Require protected release environment configuration
        shell: bash
        run: |
          if [ "$SOURCENERVE_RELEASE_ENVIRONMENT_PROTECTED" != "true" ]; then
            echo "::error::desktop-release environment must set SOURCENERVE_RELEASE_ENVIRONMENT_PROTECTED=true after protection rules are configured"
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0

      - name: Install Fedora/AppImage packaging tools
        if: matrix.kind == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot squashfs-tools

      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Verify release version contract
        working-directory: desktop
        env:
          SOURCENERVE_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:contract

      - name: Write protected Desktop .env
        working-directory: desktop
        run: node -e "require('node:fs').writeFileSync('.env', 'SOURCENERVE_BOOTSTRAP_BROKER_URL=${{ vars.SOURCENERVE_BOOTSTRAP_BROKER_URL }}\n')"

      - name: Materialize protected public product profile values
        working-directory: desktop
        run: node scripts/materialize-product-profile.mjs

      - name: Build Linux installer artifacts
        working-directory: desktop
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Verify unpacked packaged payload and secret canaries
        working-directory: desktop
        run: npm run test:packaged

      - name: Verify installer artifact set
        working-directory: desktop
        env:
          SOURCENERVE_DISTRIBUTION_KIND: ${{ matrix.kind }}
        run: npm run test:distribution

      - name: Scan tracked source and renderer bundle for release secrets
        working-directory: desktop
        run: npm run release:secret-scan

      - name: Generate updater manifest after final package bytes
        working-directory: desktop
        env:
          SOURCENERVE_DISTRIBUTION_KIND: ${{ matrix.kind }}
        run: npm run update:manifest -- ${{ matrix.arch }}

      - name: Verify updater manifest
        working-directory: desktop
        env:
          SOURCENERVE_DISTRIBUTION_KIND: ${{ matrix.kind }}
        run: npm run test:update-manifest -- ${{ matrix.arch }}

      - name: Retain verified Linux release artifacts for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified stable GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0

      - name: Verify release version contract again
        working-directory: desktop
        env:
          SOURCENERVE_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:contract

      - name: Download all native release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: false

      - name: Verify aggregate updater checksums and target completeness
        run: node desktop/scripts/verify-release-bundle.mjs release-artifacts

      - name: Stage immutable release assets
        shell: bash
        run: |
          mkdir -p release-upload
          while IFS= read -r -d '' candidate; do
            cp "$candidate" "release-upload/$(basename "$candidate")"
          done < <(find release-artifacts -type f \( -name '*.AppImage' -o -name '*.rpm' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.yml' \) -print0)
          test "$(find release-upload -type f | wc -l)" -gt 0

      - name: Create or recover draft release, verify remote assets, then publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#desktop-v}"
          version="${version#v}"

          mapfile -t local_assets < <(find release-upload -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [ "${#local_assets[@]}" -eq 0 ]; then
            echo "::error::refusing to create $tag without verified release assets"
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            asset_count="$(jq '.assets | length' <<<"$release_json")"
            if [ "$is_draft" != "true" ]; then
              if [ "$asset_count" -eq 0 ]; then
                echo "::warning::recovering published release $tag because it has zero assets"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
              else
                echo "::error::stable release $tag is already published with assets; refusing to mutate immutable release assets"
                exit 1
              fi
            else
              while IFS= read -r asset; do
                [ -z "$asset" ] || gh release delete-asset "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              done < <(jq -r '.assets[].name' <<<"$release_json")
            fi
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "SourceNerve Desktop $version" --generate-notes
          fi

          gh release upload "$tag" release-upload/* --repo "$GITHUB_REPOSITORY" --clobber

          mapfile -t remote_assets < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if ! diff -u <(printf '%s\n' "${local_assets[@]}") <(printf '%s\n' "${remote_assets[@]}"); then
            echo "::error::remote release asset set does not match the verified local asset set; leaving $tag as a draft"
            exit 1
          fi

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false

          published_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          if [ "$(jq -r '.isDraft' <<<"$published_json")" != "false" ]; then
            echo "::error::release $tag did not publish successfully"
            exit 1
          fi
          mapfile -t published_assets < <(jq -r '.assets[].name' <<<"$published_json" | LC_ALL=C sort)
          if ! diff -u <(printf '%s\n' "${local_assets[@]}") <(printf '%s\n' "${published_assets[@]}"); then
            echo "::error::published release $tag lost or changed assets after publication"
            exit 1
          fi
