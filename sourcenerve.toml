[server]
bind = "127.0.0.1:7331"

[storage]
state_dir = ".sourcenerve"

[auth]
# Keep the real production bearer token in ./sourcenerve.env.
# SourceNerve loads sourcenerve.env before this TOML and the environment value
# SOURCENERVE_BEARER_TOKEN overrides this empty placeholder.
bearer_token = ""

# Public MCP OAuth is optional. Configure issuer/resource here when the public
# Auth0-backed MCP endpoint is ready. Both values must be configured together.
#
# [oauth]
# issuer = "https://YOUR_AUTH0_TENANT.auth0.com/"
# resource = "https://YOUR_PUBLIC_DOMAIN/mcp"
# allow_operator_bearer = false
# max_token_lifetime_seconds = 300
#
# [[oauth.grant]]
# subject = "auth0|USER_ID"
# workspace = "sourcenerve"
# access = "read-write"

[[workspace]]
id = "sourcenerve"
name = "SourceNerve"
# PM2 runs with the repository root as cwd, so this works both on the VPS and
# for local development from the checked-out repository root.
root = "."
access = "read-write"
remote = "origin"
default_branch = "main"
