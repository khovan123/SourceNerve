[runtime]
mode = "control-plane"

[server]
bind = "127.0.0.1:7331"

[storage]
# Server-side state stores only control-plane data such as Desktop installation
# routing assignments. Repository index/workspace state remains on each Desktop.
state_dir = ".sourcenerve"

[oauth]
# Supply real deployment values through ./sourcenerve.env or replace these
# commented examples locally. Control-plane mode requires issuer + resource.
# issuer = "https://YOUR_AUTH0_TENANT.auth0.com/"
# resource = "https://YOUR_PUBLIC_DOMAIN/mcp"
allow_operator_bearer = false
max_token_lifetime_seconds = 300

# Intentionally no [auth], [github], [[workspace]], or [[oauth.grant]] here.
# Repository/workspace/provider credentials are owned by the Desktop data plane.
