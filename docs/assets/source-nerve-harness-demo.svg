  <text x="507" y="565" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Deny</text>

  <rect x="326" y="620" width="744" height="98" rx="16" fill="#101622" stroke="#262e40"/>
  <text x="350" y="649" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#60a5fa">ACTIVITY</text>
  <text x="350" y="674" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#94a3b8">Tool calls, diffs, jobs and verification stay in the conversation instead of a separate log wall.</text>
  <rect x="350" y="692" width="170" height="8" rx="4" fill="#263147"/>
  <rect x="350" y="692" width="112" height="8" rx="4" fill="#6366f1"/>

