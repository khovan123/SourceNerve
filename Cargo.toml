[package]
name = "sourcenerve"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Persistent repository intelligence and controlled mutation layer for AI coding agents"
license = "MIT"
repository = "https://github.com/Fogewise-Tech/SourceNerve"

[dependencies]
anyhow = "1"
axum = "0.8"
hex = "0.4"
rmcp = { version = "3.0.1", features = ["server", "schemars", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "fs", "io-util", "sync", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
