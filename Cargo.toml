[package]
name = "sourcenerve"
version = "0.1.14"
edition = "2024"
rust-version = "1.88"
description = "Persistent repository intelligence and controlled mutation layer for AI coding agents"
license = "MIT"
repository = "https://github.com/Fogewise-Tech/SourceNerve"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
hnsw_rs = "=0.3.4"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
protobuf = "=3.7.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.0.1", features = ["client", "server", "schemars", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
schemars = "1"
scip = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "fs", "io-util", "sync", "net", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tree-sitter = "0.25"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

[dev-dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
tempfile = "3"
